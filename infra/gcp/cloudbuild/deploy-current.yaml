steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: baseline-gate
    entrypoint: bash
    args:
      - -ceu
      - |
        source infra/gcp/cloud-shell/CURRENT_BASELINE.sh
        assert_aione_current_baseline
        echo '[AIONE] CURRENT baseline PASS'

  - name: gcr.io/cloud-builders/docker
    id: build-image
    args:
      - build
      - -t
      - asia-northeast1-docker.pkg.dev/$PROJECT_ID/aione/aione-backend:main-$SHORT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    id: push-image
    args:
      - push
      - asia-northeast1-docker.pkg.dev/$PROJECT_ID/aione/aione-backend:main-$SHORT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: pre-migration-current-health
    entrypoint: bash
    args:
      - -ceu
      - |
        source infra/gcp/cloud-shell/CURRENT_BASELINE.sh
        assert_aione_current_baseline

        echo '[AIONE] Verify CURRENT service is healthy before automatic schema migration'
        SERVICE_URL="$$(gcloud run services describe "$$AIONE_RUN_SERVICE" --region="$$AIONE_REGION" --project="$$AIONE_PROJECT_ID" --format='value(status.url)')"
        IAM_TOKEN="$$(gcloud auth print-identity-token --audiences="$$SERVICE_URL")"
        CURRENT_HEALTH="$$(curl -fsS -H "Authorization: Bearer $$IAM_TOKEN" "$$SERVICE_URL/health")"
        printf '%s\n' "$$CURRENT_HEALTH"
        printf '%s' "$$CURRENT_HEALTH" | python3 -c 'import json,sys; p=json.load(sys.stdin); assert p.get("ok") is True and p.get("database")=="connected"'
        echo '[AIONE] Pre-migration CURRENT health PASS'

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: automatic-current-migration
    entrypoint: bash
    args:
      - -ceu
      - |
        source infra/gcp/cloud-shell/CURRENT_BASELINE.sh
        assert_aione_current_baseline

        IMAGE="$${AIONE_REGION}-docker.pkg.dev/$${AIONE_PROJECT_ID}/$${AIONE_ARTIFACT_REPO}/$${AIONE_IMAGE_NAME}:main-${SHORT_SHA}"
        CONNECTION="$$(gcloud sql instances describe "$$AIONE_SQL_INSTANCE" --project="$$AIONE_PROJECT_ID" --format='value(connectionName)')"
        RUNTIME_SA="$${AIONE_RUNTIME_SERVICE_ACCOUNT_NAME}@$${AIONE_PROJECT_ID}.iam.gserviceaccount.com"
        REPO_VERSION="$$(find data-code/migrations -maxdepth 1 -type f -name '[0-9][0-9][0-9][0-9]_*.sql' -printf '%f\n' | sort | tail -n1 | cut -d_ -f1)"

        test -n "$$REPO_VERSION"
        printf '[AIONE] Automatic CURRENT migration target: %s\n' "$$REPO_VERSION"

        gcloud run jobs deploy "$$AIONE_MIGRATION_JOB" \
          --image="$$IMAGE" \
          --region="$$AIONE_REGION" \
          --project="$$AIONE_PROJECT_ID" \
          --service-account="$$RUNTIME_SA" \
          --set-cloudsql-instances="$$CONNECTION" \
          --set-env-vars="DB_USER=$${AIONE_DB_USER},DB_NAME=$${AIONE_DB_NAME},INSTANCE_UNIX_SOCKET=/cloudsql/$${CONNECTION},NODE_ENV=production" \
          --set-secrets="DB_PASS=$${AIONE_DB_PASSWORD_SECRET}:latest" \
          --command=npm \
          --args=run,db:migrate \
          --tasks=1 \
          --max-retries=0 \
          --task-timeout=10m \
          --quiet

        gcloud run jobs execute "$$AIONE_MIGRATION_JOB" \
          --region="$$AIONE_REGION" \
          --project="$$AIONE_PROJECT_ID" \
          --wait

        echo '[AIONE] Automatic CURRENT migration execution PASS'

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: migration-gate
    entrypoint: bash
    args:
      - -ceu
      - |
        source infra/gcp/cloud-shell/CURRENT_BASELINE.sh
        assert_aione_current_baseline

        echo '[AIONE] Verify CURRENT DB migration matches Repo after automatic migration'
        SERVICE_URL="$$(gcloud run services describe "$$AIONE_RUN_SERVICE" --region="$$AIONE_REGION" --project="$$AIONE_PROJECT_ID" --format='value(status.url)')"
        IAM_TOKEN="$$(gcloud auth print-identity-token --audiences="$$SERVICE_URL")"
        HEALTH_JSON="$$(curl -fsS -H "Authorization: Bearer $$IAM_TOKEN" "$$SERVICE_URL/health")"
        DB_VERSION="$$(printf '%s' "$$HEALTH_JSON" | python3 -c 'import json,sys; p=json.load(sys.stdin); print((p.get("latestMigration") or {}).get("version") or "")')"
        REPO_VERSION="$$(find data-code/migrations -maxdepth 1 -type f -name '[0-9][0-9][0-9][0-9]_*.sql' -printf '%f\n' | sort | tail -n1 | cut -d_ -f1)"

        printf 'db_migration=%s\nrepo_migration=%s\n' "$$DB_VERSION" "$$REPO_VERSION"
        test -n "$$DB_VERSION"
        test -n "$$REPO_VERSION"
        if [[ "$$DB_VERSION" != "$$REPO_VERSION" ]]; then
          echo '[AIONE][STOP] Automatic migration did not align CURRENT DB with Repo. Deployment is blocked.' >&2
          exit 20
        fi
        echo '[AIONE] Migration gate PASS'

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: read-only-db-preflight
    entrypoint: bash
    args:
      - -ceu
      - |
        source infra/gcp/cloud-shell/CURRENT_BASELINE.sh
        assert_aione_current_baseline
        IMAGE="$${AIONE_REGION}-docker.pkg.dev/$${AIONE_PROJECT_ID}/$${AIONE_ARTIFACT_REPO}/$${AIONE_IMAGE_NAME}:main-${SHORT_SHA}"
        CONNECTION="$$(gcloud sql instances describe "$$AIONE_SQL_INSTANCE" --project="$$AIONE_PROJECT_ID" --format='value(connectionName)')"
        RUNTIME_SA="$${AIONE_RUNTIME_SERVICE_ACCOUNT_NAME}@$${AIONE_PROJECT_ID}.iam.gserviceaccount.com"

        gcloud run jobs deploy "$$AIONE_PREFLIGHT_JOB" \
          --image="$$IMAGE" \
          --region="$$AIONE_REGION" \
          --project="$$AIONE_PROJECT_ID" \
          --service-account="$$RUNTIME_SA" \
          --set-cloudsql-instances="$$CONNECTION" \
          --set-env-vars="DB_USER=$${AIONE_DB_USER},DB_NAME=$${AIONE_DB_NAME},INSTANCE_UNIX_SOCKET=/cloudsql/$${CONNECTION},AIONE_ALLOW_PREVIEW_ACTOR=false,AIONE_ALLOW_SYSTEM_WRITES=false,NODE_ENV=production" \
          --set-secrets="DB_PASS=$${AIONE_DB_PASSWORD_SECRET}:latest" \
          --command=npm \
          --args=run,db:preflight,--,--strict \
          --tasks=1 \
          --max-retries=0 \
          --task-timeout=10m \
          --quiet

        gcloud run jobs execute "$$AIONE_PREFLIGHT_JOB" \
          --region="$$AIONE_REGION" \
          --project="$$AIONE_PROJECT_ID" \
          --wait

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: candidate-deploy-health-cutover
    entrypoint: bash
    args:
      - -ceu
      - |
        source infra/gcp/cloud-shell/CURRENT_BASELINE.sh
        assert_aione_current_baseline

        IMAGE="$${AIONE_REGION}-docker.pkg.dev/$${AIONE_PROJECT_ID}/$${AIONE_ARTIFACT_REPO}/$${AIONE_IMAGE_NAME}:main-${SHORT_SHA}"
        CONNECTION="$$(gcloud sql instances describe "$$AIONE_SQL_INSTANCE" --project="$$AIONE_PROJECT_ID" --format='value(connectionName)')"
        RUNTIME_SA="$${AIONE_RUNTIME_SERVICE_ACCOUNT_NAME}@$${AIONE_PROJECT_ID}.iam.gserviceaccount.com"
        CANDIDATE_TAG="candidate-${SHORT_SHA}"
        PREVIOUS_REVISION="$$(gcloud run services describe "$$AIONE_RUN_SERVICE" --region="$$AIONE_REGION" --project="$$AIONE_PROJECT_ID" --format='value(status.traffic[0].revisionName)')"

        echo "[AIONE] Previous traffic revision: $$PREVIOUS_REVISION"
        echo '[AIONE] Deploy candidate with 0 percent traffic'
        gcloud run deploy "$$AIONE_RUN_SERVICE" \
          --image="$$IMAGE" \
          --region="$$AIONE_REGION" \
          --project="$$AIONE_PROJECT_ID" \
          --service-account="$$RUNTIME_SA" \
          --set-cloudsql-instances="$$CONNECTION" \
          --update-secrets="DB_PASS=$${AIONE_DB_PASSWORD_SECRET}:latest,OPENAI_API_KEY=$${AIONE_OPENAI_API_KEY_SECRET}:latest" \
          --update-env-vars="^@^DB_USER=$${AIONE_DB_USER}@DB_NAME=$${AIONE_DB_NAME}@INSTANCE_UNIX_SOCKET=/cloudsql/$${CONNECTION}@NODE_ENV=production@AIONE_ALLOW_PREVIEW_ACTOR=false@AIONE_ALLOW_SYSTEM_WRITES=false@AIONE_REQUIRE_GOOGLE_AUTH=true@AIONE_GOOGLE_CLIENT_ID=$${AIONE_GOOGLE_CLIENT_ID}@AIONE_AI_MODE=$${AIONE_AI_MODE}@AIONE_AI_PROVIDER=$${AIONE_AI_PROVIDER}@AIONE_AI_MODEL=$${AIONE_AI_MODEL}@AIONE_AI_IMAGE_MODEL=$${AIONE_AI_IMAGE_MODEL}@AIONE_AI_IMAGE_QUALITY=$${AIONE_AI_IMAGE_QUALITY}@AIONE_DRIVE_PROXY_ENABLED=true@AIONE_CORS_ORIGINS=$${AIONE_PRODUCTION_ORIGIN},$${AIONE_TEST_ORIGIN}" \
          --no-allow-unauthenticated \
          --no-traffic \
          --tag="$$CANDIDATE_TAG" \
          --quiet

        SERVICE_JSON="$$(gcloud run services describe "$$AIONE_RUN_SERVICE" --region="$$AIONE_REGION" --project="$$AIONE_PROJECT_ID" --format=json)"
        CANDIDATE_REVISION="$$(printf '%s' "$$SERVICE_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"]["latestReadyRevisionName"])')"
        SERVICE_URL="$$(printf '%s' "$$SERVICE_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"]["url"])')"
        CANDIDATE_URL="$$(printf '%s' "$$SERVICE_JSON" | python3 -c 'import json,sys; p=json.load(sys.stdin); tag=sys.argv[1]; print(next(x["url"] for x in p["status"]["traffic"] if x.get("tag")==tag))' "$$CANDIDATE_TAG")"
        IAM_TOKEN="$$(gcloud auth print-identity-token --audiences="$$SERVICE_URL")"

        echo "[AIONE] Candidate revision: $$CANDIDATE_REVISION"
        echo '[AIONE] Authenticated candidate /health'
        CANDIDATE_HEALTH="$$(curl -fsS -H "Authorization: Bearer $$IAM_TOKEN" "$$CANDIDATE_URL/health")"
        printf '%s\n' "$$CANDIDATE_HEALTH"
        printf '%s' "$$CANDIDATE_HEALTH" | python3 -c 'import json,sys; p=json.load(sys.stdin); assert p.get("ok") is True and p.get("database")=="connected"'

        echo '[AIONE] Candidate healthy; switch 100 percent traffic'
        gcloud run services update-traffic "$$AIONE_RUN_SERVICE" \
          --region="$$AIONE_REGION" \
          --project="$$AIONE_PROJECT_ID" \
          --to-revisions="$${CANDIDATE_REVISION}=100" \
          --quiet

        echo '[AIONE] Verify production after cutover'
        if ! FINAL_HEALTH="$$(curl -fsS -H "Authorization: Bearer $$IAM_TOKEN" "$$SERVICE_URL/health")"; then
          echo '[AIONE][ERROR] Post-cutover health failed; rolling traffic back.' >&2
          if [[ -n "$$PREVIOUS_REVISION" ]]; then
            gcloud run services update-traffic "$$AIONE_RUN_SERVICE" \
              --region="$$AIONE_REGION" \
              --project="$$AIONE_PROJECT_ID" \
              --to-revisions="$${PREVIOUS_REVISION}=100" \
              --quiet || true
          fi
          exit 30
        fi
        printf '%s\n' "$$FINAL_HEALTH"
        printf '%s' "$$FINAL_HEALTH" | python3 -c 'import json,sys; p=json.load(sys.stdin); assert p.get("ok") is True and p.get("database")=="connected"'

        echo "[AIONE] AUTO MIGRATE + DEPLOY PASS: $${AIONE_RUN_SERVICE} -> $${AIONE_SQL_INSTANCE} -> $${CANDIDATE_REVISION}"

options:
  logging: CLOUD_LOGGING_ONLY
  dynamic_substitutions: true

timeout: 1800s
