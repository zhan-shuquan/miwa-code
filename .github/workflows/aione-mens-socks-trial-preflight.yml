name: AIONE Mens Socks Trial Preflight

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  trial-preflight-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check preflight script syntax
        working-directory: apps/systems/aione/backend
        run: node --check scripts/preflight-mens-socks-trial-gate-c.js

      - name: Check runner syntax
        run: bash -n infra/gcp/automation/RUN_MENS_SOCKS_TRIAL_GATE_C_PREFLIGHT_V1.sh

      - name: Guard preflight against generation, activation or mutation wiring
        run: |
          grep -Fq 'BEGIN READ ONLY' apps/systems/aione/backend/scripts/preflight-mens-socks-trial-gate-c.js
          grep -Fq 'MH0000002' apps/systems/aione/backend/scripts/preflight-mens-socks-trial-gate-c.js
          grep -Fq 'MS-HERO-01' apps/systems/aione/backend/scripts/preflight-mens-socks-trial-gate-c.js
          grep -Fq 'MS-REASON1-04' apps/systems/aione/backend/scripts/preflight-mens-socks-trial-gate-c.js
          grep -Fq 'MS-SIZE-12' apps/systems/aione/backend/scripts/preflight-mens-socks-trial-gate-c.js
          ! grep -Eq 'OPENAI_API_KEY|runOpenAIImage|executeBenefitFeature|INSERT INTO|UPDATE public|DELETE FROM|lifecycle_status=.active.' apps/systems/aione/backend/scripts/preflight-mens-socks-trial-gate-c.js
          ! grep -Eq 'OPENAI_API_KEY|AIONE_OPENAI_API_KEY_SECRET|design:template-set:gate-c' infra/gcp/automation/RUN_MENS_SOCKS_TRIAL_GATE_C_PREFLIGHT_V1.sh
