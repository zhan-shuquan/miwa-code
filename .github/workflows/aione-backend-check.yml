name: AIONE Backend Check

on:
  pull_request:
    paths:
      - "apps/systems/aione/backend/**"
      - ".github/workflows/aione-backend-check.yml"
  push:
    branches:
      - main
    paths:
      - "apps/systems/aione/backend/**"
      - ".github/workflows/aione-backend-check.yml"

permissions:
  contents: read

jobs:
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/systems/aione/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies for syntax validation
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Syntax check
        run: npm run check

      - name: Report lockfile drift
        run: |
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); const pd=p.dependencies||{}; const ld=(l.packages&&l.packages['']&&l.packages[''].dependencies)||{}; const missing=Object.keys(pd).filter(k=>pd[k]!==ld[k]); if(missing.length){console.error('package-lock drift:', missing.join(',')); process.exitCode=2}else{console.log('package-lock aligned')}"
        continue-on-error: true
