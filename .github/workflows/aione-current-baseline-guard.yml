name: AIONE CURRENT Baseline Guard

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  guard-current-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required CURRENT baseline
        shell: bash
        run: |
          set -euo pipefail
          source infra/gcp/cloud-shell/CURRENT_BASELINE.sh

          test "$AIONE_PROJECT_ID" = "miwa-aione"
          test "$AIONE_RUN_SERVICE" = "aione-backend-current"
          test "$AIONE_SQL_INSTANCE" = "aione-pg-dev"
          test "$AIONE_DB_NAME" = "aione"
          test "$AIONE_DB_USER" = "aione_app"
          test "$AIONE_DB_PASSWORD_SECRET" = "aione-db-password-dev"
          test "$AIONE_PREFLIGHT_JOB" = "aione-db-preflight-current"
          test "$AIONE_MIGRATION_JOB" = "aione-db-migrate-current"
          test "$AIONE_DEPLOY_TRIGGER_NAME" = "aione-current-deploy"

      - name: Verify fully automated deployment assets exist
        shell: bash
        run: |
          set -euo pipefail
          test -f infra/gcp/cloudbuild/deploy-current.yaml
          test -f infra/gcp/automation/INSTALL_CURRENT_AUTOMATION.sh
          grep -Fq '$AIONE_RUN_SERVICE' infra/gcp/cloudbuild/deploy-current.yaml
          grep -Fq '$AIONE_SQL_INSTANCE' infra/gcp/cloudbuild/deploy-current.yaml
          grep -Fq 'id: automatic-current-migration' infra/gcp/cloudbuild/deploy-current.yaml
          grep -Fq '$AIONE_MIGRATION_JOB' infra/gcp/cloudbuild/deploy-current.yaml
          grep -Fq -- '--args=run,db:migrate' infra/gcp/cloudbuild/deploy-current.yaml
          grep -Fq 'id: migration-gate' infra/gcp/cloudbuild/deploy-current.yaml
          grep -Fq 'id: read-only-db-preflight' infra/gcp/cloudbuild/deploy-current.yaml
          grep -Fq 'candidate-' infra/gcp/cloudbuild/deploy-current.yaml
          grep -Fq -- '--no-traffic' infra/gcp/cloudbuild/deploy-current.yaml
          grep -Fq 'update-traffic' infra/gcp/cloudbuild/deploy-current.yaml
          grep -Fq 'AUTO MIGRATE + DEPLOY PASS' infra/gcp/cloudbuild/deploy-current.yaml
          grep -Fq 'No Cloud Shell migration/deploy command is required for normal releases.' infra/gcp/automation/INSTALL_CURRENT_AUTOMATION.sh

      - name: Verify manual CURRENT deploy entrypoints are retired
        shell: bash
        run: |
          set -euo pipefail
          manual_files=(
            infra/gcp/automation/APPLY_CURRENT_MIGRATIONS_AND_DEPLOY.sh
            infra/gcp/cloud-shell/09_DEPLOY_CURRENT_BACKEND.sh
          )
          for file in "${manual_files[@]}"; do
            grep -Fq 'retired' "$file"
            if grep -Eq 'gcloud (run deploy|builds submit|run jobs deploy|run jobs execute)' "$file"; then
              echo "[AIONE][FATAL] Retired manual deployment file still contains live deployment commands: $file"
              exit 5
            fi
          done
          echo 'Manual CURRENT deploy entrypoints are retired.'

      - name: Verify automatic pipeline stage order
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          text = Path('infra/gcp/cloudbuild/deploy-current.yaml').read_text(encoding='utf-8')
          stages = [
              'id: build-image',
              'id: push-image',
              'id: pre-migration-current-health',
              'id: automatic-current-migration',
              'id: migration-gate',
              'id: read-only-db-preflight',
              'id: candidate-deploy-health-cutover',
          ]
          positions = [text.index(stage) for stage in stages]
          if positions != sorted(positions):
              raise SystemExit('[AIONE][FATAL] CURRENT automatic pipeline stage order is invalid.')
          print('Automatic CURRENT migrate/deploy stage order PASS.')
          PY

      - name: Block unescaped Cloud Build shell variables
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('infra/gcp/cloudbuild/deploy-current.yaml')
          text = path.read_text(encoding='utf-8')
          allowed = {'PROJECT_ID', 'SHORT_SHA'}
          failures = []
          pattern = re.compile(r'(?<!\$)\$(?:\{)?([A-Z][A-Z0-9_]*)')
          for lineno, line in enumerate(text.splitlines(), 1):
              for match in pattern.finditer(line):
                  name = match.group(1)
                  if name not in allowed:
                      failures.append((lineno, name, line.strip()))
          if failures:
              for lineno, name, line in failures:
                  print(f'[AIONE][FATAL] Cloud Build shell variable must be escaped with $$: line {lineno}: {name}: {line}')
              raise SystemExit(4)
          print('Cloud Build shell-variable escaping guard passed.')
          PY

      - name: Block legacy runtime targets in active CURRENT deployment files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            infra/gcp/cloud-shell/lib.sh
            infra/gcp/cloud-shell/cloud-config.sh.example
            infra/gcp/cloud-shell/README.md
            infra/gcp/cloudbuild/deploy-current.yaml
            infra/gcp/automation/INSTALL_CURRENT_AUTOMATION.sh
          )

          legacy='aione-backend-v190|aione-backend-dev|aione-backend-pgdev-check|aione-postgres'

          if grep -En "$legacy" "${files[@]}"; then
            echo "[AIONE][FATAL] Legacy runtime target found in active CURRENT deployment files."
            exit 1
          fi

      - name: Block alternate database/deployment paths from returning
        shell: bash
        run: |
          set -euo pipefail
          removed=(
            .github/workflows/aione-db-preflight-manual.yml
            infra/gcp/cloud-shell/00_DISCOVER.sh
            infra/gcp/cloud-shell/01_PREPARE_RUNTIME.sh
            infra/gcp/cloud-shell/02_BUILD_IMAGE.sh
            infra/gcp/cloud-shell/03A_DB_INSTANCE_BASELINE_AUDIT.sh
            infra/gcp/cloud-shell/03B_LEGACY_DATA_INVENTORY.sh
            infra/gcp/cloud-shell/03_DB_PREFLIGHT.sh
            infra/gcp/cloud-shell/04_DB_MIGRATE.sh
            infra/gcp/cloud-shell/05_DEPLOY_BACKEND_PRIVATE.sh
            infra/gcp/cloud-shell/06_SMOKE_TEST.sh
            infra/gcp/cloud-shell/10_ENFORCE_SINGLE_CURRENT_RUNTIME.sh
            infra/gcp/cloud-shell/11_PURGE_NON_CURRENT_JOBS.sh
          )

          for file in "${removed[@]}"; do
            if [[ -e "$file" ]]; then
              echo "[AIONE][FATAL] Removed legacy/alternate runtime path returned: $file"
              exit 2
            fi
          done

          active_files=(
            infra/gcp/cloud-shell/CURRENT_BASELINE.sh
            infra/gcp/cloud-shell/lib.sh
            infra/gcp/cloudbuild/deploy-current.yaml
            infra/gcp/automation/INSTALL_CURRENT_AUTOMATION.sh
          )

          if grep -Fn 'AIONE_DATABASE_URL' "${active_files[@]}"; then
            echo '[AIONE][FATAL] Alternate DATABASE_URL deployment path detected.'
            exit 3
          fi

          echo "AIONE CURRENT baseline guard passed."
