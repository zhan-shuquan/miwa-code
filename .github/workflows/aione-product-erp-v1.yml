name: AIONE Product ERP V1 Smoke
on:
  pull_request:
    paths:
      - 'apps/systems/aione/backend/src/**'
      - 'apps/systems/aione/backend/scripts/test-product-effective-sku*.js'
      - 'apps/systems/aione/backend/scripts/test-product-settings-sku*.js'
      - 'apps/systems/aione/js/config/product-custom-columns.js'
      - 'apps/systems/aione/js/config/product-effective-sku.js'
      - 'apps/systems/aione/js/config/product-shared-cost-engine.js'
      - 'apps/systems/aione/js/components/erp-data-grid.js'
      - 'apps/systems/aione/js/pages/product-erp-secondary-lists.js'
      - 'apps/systems/aione/js/pages/product-manual-entry.js'
      - 'apps/systems/aione/js/pages/product-home-current.js'
      - 'apps/systems/aione/js/config/home-registry.js'
      - 'apps/systems/aione/js/config/sidebar-registry.js'
      - 'apps/systems/aione/tests/verify-product-erp-v1.mjs'
      - '.github/workflows/aione-product-erp-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check ERP V1 source and syntax
        run: node apps/systems/aione/tests/verify-product-erp-v1.mjs
      - name: Install contract dependencies
        working-directory: apps/systems/aione/backend
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Verify effective SKU costs and price contracts
        run: |
          node apps/systems/aione/backend/scripts/test-product-effective-sku.js
          node apps/systems/aione/backend/scripts/test-product-settings-sku-integration.js
          node apps/systems/aione/backend/scripts/test-rakuten-itemapi2-payload-preview.js
          node apps/systems/aione/js/config/product-shared-cost-engine.test.js
      - name: Verify SKU editor interactions
        run: |
          npm install --prefix /tmp/aione-ui-tests --no-package-lock --ignore-scripts --no-audit --no-fund jsdom@30.1.3
          AIONE_JSDOM_MODULE=/tmp/aione-ui-tests/node_modules/jsdom/lib/api.js node apps/systems/aione/backend/scripts/test-product-effective-sku-ui.js
          AIONE_JSDOM_MODULE=/tmp/aione-ui-tests/node_modules/jsdom/lib/api.js node apps/systems/aione/backend/scripts/test-product-settings-sku-ui.js
