permissions:
  contents: read
jobs:
  product-entry-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aione_ci
          POSTGRES_PASSWORD: aione_ci
          POSTGRES_DB: aione_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aione_ci -d aione_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://aione_ci:aione_ci@localhost:5432/aione_ci
      AIONE_ENV: controlled-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        working-directory: apps/systems/aione/backend
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Validate changed JS syntax
        run: |
          node --check apps/systems/aione/backend/src/services/product-local-image-sync-contract.js
          node --check apps/systems/aione/backend/scripts/test-product-local-image-sync-route.js
          node --check apps/systems/aione/backend/scripts/test-product-local-image-sync-contract.js
          node --check apps/systems/aione/backend/src/services/product-image-name-contract.js
          node --check apps/systems/aione/backend/src/services/product-image-webp-service.js
          node --check apps/systems/aione/backend/scripts/test-product-image-webp.js
          node --check apps/systems/aione/backend/src/routes/product-assets.js
          node --check apps/systems/aione/backend/src/routes/rakuten-itemapi-preflight.js
          node --check apps/systems/aione/backend/scripts/test-rakuten-live-readback-contract.js
          node --check apps/systems/aione/backend/src/services/rakuten-image-access-diagnostic.js
          node --check apps/systems/aione/backend/scripts/test-rakuten-image-access-diagnostic.js
          node --check apps/systems/aione/backend/src/services/rakuten-itemapi2-payload-preview.js
          node --check apps/systems/aione/backend/src/services/rakuten-first-live-publish.js
          node --check apps/systems/aione/backend/src/services/rakuten-first-live-sku-review.js
          node --check apps/systems/aione/backend/scripts/test-rakuten-first-live-sku-review.js
          node --check apps/systems/aione/backend/scripts/test-rakuten-first-live-permission.js
          node --check apps/systems/aione/backend/src/services/rakuten-auto-mapping.js
          node --check apps/systems/aione/backend/scripts/test-rakuten-auto-mapping.js
          node --check apps/systems/aione/backend/scripts/test-rakuten-itemapi2-payload-preview.js
          node --check apps/systems/aione/backend/src/integrations/rakuten-commerce-client.js
          node --check apps/systems/aione/backend/scripts/test-rakuten-commerce-client.js
          node --check apps/systems/aione/backend/src/services/rakuten-v25-first-item-contract.js
          node --check apps/systems/aione/backend/scripts/test-rakuten-v25-first-item-contract.js
          node --check apps/systems/aione/backend/src/services/rakuten-attribute-mapper.js
          node --check apps/systems/aione/backend/scripts/test-rakuten-attribute-mapper.js
          node --check apps/systems/aione/backend/src/services/rakuten-itemapi-preflight.js
          node --check apps/systems/aione/backend/scripts/test-rakuten-itemapi-preflight.js
          node --check apps/systems/aione/backend/src/routes/product-image-sync.js
          node --check apps/systems/aione/backend/scripts/test-product-image-name-current.js
          node --check apps/systems/aione/backend/src/services/product-entry-contract.js
          node --check apps/systems/aione/backend/src/services/product-manual-entry-service.js
          node --check apps/systems/aione/backend/src/routes/product-manual-entry.js
          node --check apps/systems/aione/backend/scripts/test-product-entry-current.js
          node --check apps/systems/aione/js/config/shared-parameter-defaults.js
          node --check apps/systems/aione/js/config/product-shared-cost-engine.js
          node --check apps/systems/aione/js/config/product-shared-cost-engine.test.js
          node --check apps/systems/aione/backend/src/services/shared-parameters-service.js
          node --check apps/systems/aione/backend/src/routes/shared-parameters.js
          node --check apps/systems/aione/backend/scripts/test-shared-parameters-contract.js
          node --check apps/systems/aione/js/shell/system-settings.js
          node --check apps/systems/aione/js/config/product-pricing-math.js
          node --check apps/systems/aione/js/config/product-pricing-math.test.js
          node --check apps/systems/aione/js/services/rakuten-readback-acceptance.js
          node --check apps/systems/aione/js/services/rakuten-readback-acceptance.test.js
          node --check apps/systems/aione/js/services/product-sku-image-identity.js
          node --check apps/systems/aione/js/services/product-sku-image-identity.test.js
          node --check apps/systems/aione/js/pages/product-manual-entry.js
          node --check apps/systems/aione/js/services/rakuten-pilot-publish.js
          node --check apps/systems/aione/js/services/rakuten-pilot-publish.test.js
          node --check apps/systems/aione/backend/src/routes/integrations-rakuten.js
          node --check apps/systems/aione/backend/src/routes/rakuten-canonical-publish.js
          node --check apps/systems/aione/backend/src/integrations/rakuten-cabinet-upload.js
          node --check apps/systems/aione/backend/src/integrations/rakuten-rms-client.js
          node --check apps/systems/aione/backend/scripts/test-rakuten-shop-publishing-options.js
          node --check apps/systems/aione/backend/src/services/rakuten-first-item-candidate.js
          node --check apps/systems/aione/backend/scripts/test-rakuten-first-item-candidate.js
          node --check apps/systems/aione/backend/src/services/rakuten-cabinet-reconciliation.js
          node --check apps/systems/aione/backend/scripts/test-rakuten-cabinet-reconciliation.js
          node --check apps/systems/aione/backend/src/integrations/rakuten-cabinet-image.js
          node --check apps/systems/aione/backend/src/services/rakuten-canonical-publish-service.js
          node --check apps/systems/aione/backend/scripts/test-rakuten-cabinet-upload-contract.js
          node --check apps/systems/aione/js/pages/product-home-current.js
          node --check apps/systems/aione/backend/server.js
      - name: Initialize disposable CURRENT SQL baseline
        env:
          PGPASSWORD: aione_ci
        run: psql -h localhost -U aione_ci -d aione_ci -v ON_ERROR_STOP=1 -f data-code/current/0001_aione_current_baseline.sql
      - name: Validate SKU asset FK on disposable CURRENT baseline
        env:
          PGPASSWORD: aione_ci
        run: |
          psql -h localhost -U aione_ci -d aione_ci -v ON_ERROR_STOP=1 -f data-code/migrations/0103_product_asset_sku_identity_link.sql
          psql -h localhost -U aione_ci -d aione_ci -v ON_ERROR_STOP=1 -Atc "SELECT CASE WHEN EXISTS (SELECT 1 FROM pg_constraint WHERE conname='fk_product_assets_product_sku_same_product') THEN 'PASS' ELSE 'FAIL' END" | grep -Fx PASS
      - name: Verify unified shared parameters Cloud SQL schema and versioned write
        env:
          PGPASSWORD: aione_ci
        run: |
          psql -h localhost -U aione_ci -d aione_ci -v ON_ERROR_STOP=1 -f data-code/migrations/0110_p0_unified_shared_parameters.sql
          psql -h localhost -U aione_ci -d aione_ci -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          INSERT INTO public.aione_shared_parameters(scope,version,payload,updated_by)
            VALUES('global',1,'{"commerce":{"logistics":{}}}'::jsonb,'ci');
          INSERT INTO public.aione_shared_parameter_history(scope,version,payload,updated_by,change_reason)
            VALUES('global',1,'{"commerce":{"logistics":{}}}'::jsonb,'ci','seed');
          UPDATE public.aione_shared_parameters SET version=2,payload='{"commerce":{"logistics":{"updated":true}}}'::jsonb WHERE scope='global';
          INSERT INTO public.aione_shared_parameter_history(scope,version,payload,updated_by,change_reason)
            VALUES('global',2,'{"commerce":{"logistics":{"updated":true}}}'::jsonb,'ci','update');
          -- Fail the CI transaction if either the live version or history is wrong.
          SELECT 1 / CASE WHEN
            (SELECT version FROM public.aione_shared_parameters WHERE scope='global') = 2
            AND (SELECT count(*) FROM public.aione_shared_parameter_history WHERE scope='global') = 2
            THEN 1 ELSE 0 END AS version_and_history_verified;
          ROLLBACK;
          SQL
      - name: Validate product image naming classifier
        working-directory: apps/systems/aione/backend
        run: node scripts/test-product-image-name-current.js
      - name: Validate safe local image sync contract (no external writes)
        working-directory: apps/systems/aione/backend
        run: node scripts/test-product-local-image-sync-contract.js
      - name: Verify in-memory end-to-end image sync route (no GCS/Rakuten)
        working-directory: apps/systems/aione/backend
        run: node scripts/test-product-local-image-sync-route.js
      - name: Windows sync script safe dry-run smoke test
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'zjl238'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          [System.IO.File]::WriteAllBytes((Join-Path $folder 'zjl238_01.png'), [byte[]](1..32))
          [System.IO.File]::WriteAllBytes((Join-Path $folder 'zjl238_c01.jpg'), [byte[]](1..32))
          $out = & ./apps/systems/aione/backend/tools/windows/SYNC_AIONE_PRODUCT_IMAGES.ps1 -Folder $folder -ProductId 'prd_c61a3ec2-9e98-4892-8d08-985b7962f74a' | Out-String
          if ($out -notmatch 'DRY-RUN ONLY' -or $out -notmatch 'Files: 2') { throw 'Windows dry-run did not complete safely.' }
          if (!(Test-Path (Join-Path $folder 'zjl238_01.png'))) { throw 'Original image was modified.' }
      - name: Validate product SKU image identity mapping
        run: node apps/systems/aione/js/services/product-sku-image-identity.test.js
      - name: Verify zjl238 Cabinet pilot workflow (mocked, no RMS writes)
        run: node apps/systems/aione/js/services/rakuten-pilot-publish.test.js
      - name: Verify Cabinet read-only reconciliation parser
        working-directory: apps/systems/aione/backend
        run: node scripts/test-rakuten-cabinet-reconciliation.js
      - name: Verify Cabinet upload XML and fail-closed response (mocked)
        working-directory: apps/systems/aione/backend
        run: node scripts/test-rakuten-cabinet-upload-contract.js
      - name: Verify store-bound ItemAPI and InventoryAPI adapters
        working-directory: apps/systems/aione/backend
        run: node scripts/test-rakuten-commerce-client.js
      - name: Verify store read-only shipping options
        working-directory: apps/systems/aione/backend
        run: node scripts/test-rakuten-shop-publishing-options.js
      - name: Verify strict first-item candidate guards
        working-directory: apps/systems/aione/backend
        run: node scripts/test-rakuten-first-item-candidate.js
      - name: Verify ItemAPI2 read-only JSON preview
        working-directory: apps/systems/aione/backend
        run: node scripts/test-rakuten-itemapi2-payload-preview.js
      - name: Verify first live SKU mapping
        working-directory: apps/systems/aione/backend
        run: node scripts/test-rakuten-first-live-sku-review.js
      - name: Verify real R-Cabinet image paths and image-only repair preview
        working-directory: apps/systems/aione/backend
        run: |
          node scripts/test-rakuten-cabinet-image-location.js
          node scripts/test-rakuten-image-repair-preview.js
      - name: Verify RMS actual image file access without writes
        working-directory: apps/systems/aione/backend
        run: node scripts/test-rakuten-image-access-diagnostic.js
      - name: Reject stale or incomplete RMS readback responses
        run: node apps/systems/aione/js/services/rakuten-readback-acceptance.test.js
      - name: Verify independent RMS GET-only reconciliation contract
        working-directory: apps/systems/aione/backend
        run: node scripts/test-rakuten-live-readback-contract.js
      - name: Verify final review, two-button confirmation and publisher permission (no RMS writes)
        working-directory: apps/systems/aione/backend
        run: node scripts/test-rakuten-first-live-permission.js
      - name: Verify deterministic Rakuten source mapping
        working-directory: apps/systems/aione/backend
        run: node scripts/test-rakuten-auto-mapping.js
      - name: Verify store-safe ItemAPI GET
        working-directory: apps/systems/aione/backend
        run: node scripts/test-rakuten-itemapi-get.js
      - name: Verify Rakuten V2.5 first-item contract
        working-directory: apps/systems/aione/backend
        run: node scripts/test-rakuten-v25-first-item-contract.js
      - name: Verify Rakuten genre attribute dash fallback
        working-directory: apps/systems/aione/backend
        run: node scripts/test-rakuten-attribute-mapper.js
      - name: Verify Rakuten ItemAPI fail-closed readiness contract
        working-directory: apps/systems/aione/backend
        run: node scripts/test-rakuten-itemapi-preflight.js
      - name: Verify WebP display cache contract
        working-directory: apps/systems/aione/backend
        run: node scripts/test-product-image-webp.js
      - name: Verify owner-approved shared parameters and all eight logistics tariffs
        run: |
          node apps/systems/aione/js/config/product-shared-cost-engine.test.js
          node apps/systems/aione/backend/scripts/test-shared-parameters-contract.js
      - name: Validate actual break-even calculation
        run: node apps/systems/aione/js/config/product-pricing-math.test.js
      - name: Test Excel/WPS and CURRENT database roundtrip (no Rakuten)
        working-directory: apps/systems/aione/backend
        run: node scripts/test-product-entry-current.js

      - name: Validate settings center schema and permissions
        run: node apps/systems/aione/backend/scripts/test-settings-center.js
      - name: Verify settings center persistence and concurrent deletion on disposable Postgres
        run: node apps/systems/aione/backend/scripts/test-settings-center-db.js

      - name: Verify Excel settings templates and import validation
        run: node apps/systems/aione/backend/scripts/test-settings-catalog-workbook.js
