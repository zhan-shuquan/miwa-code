name: AIONE Design Engine Router

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  design-engine-router:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/systems/aione/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Install deterministic renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick fonts-noto-cjk

      - name: Syntax check Design Engine router
        run: |
          node --check src/services/design-engine-router-service.js
          node --check src/services/design-execution-service.js
          node --check src/services/design-white-background-output-service.js
          node --check src/services/design-model-wear-output-service.js
          node --check src/services/design-deterministic-page-output-service.js
          node --check src/services/design-deterministic-media-output-service.js
          node --check src/routes/design.js
          node --check scripts/test-design-engine-router.js

      - name: Prove Design Engine execution registry contract
        run: node scripts/test-design-engine-router.js
