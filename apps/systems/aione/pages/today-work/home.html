<section class="core-work-page today-work-page" aria-labelledby="today-work-title">
  <header class="core-page-head">
    <div>
      <span class="core-page-eyebrow">个人工作与全员协作</span>
      <h1 id="today-work-title">今日工作</h1>
      <p>集中查看本人关心的任务与进展；任何成员都可以向任何成员布置任务，也可以提交建议与创新。</p>
    </div>
    <div class="core-page-actions">
      <button class="core-button secondary" id="open-suggestion-dialog" type="button">＋ 建议与创新</button>
      <button class="core-button primary" id="open-task-dialog" type="button">＋ 布置任务</button>
    </div>
  </header>

  <div class="core-data-note"><strong>内测数据层</strong><span>当前浏览器可真实新增、完成和保留数据；集团多人实时协作将在正式数据库接口接入后开启。</span></div>

  <section class="work-summary" aria-label="今日工作摘要">
    <article><span>待我处理</span><strong id="work-count-assigned">0</strong></article>
    <article><span>我布置的</span><strong id="work-count-created">0</strong></article>
    <article><span>今日完成</span><strong id="work-count-completed">0</strong></article>
    <article><span>建议与创新</span><strong id="work-count-suggestions">0</strong></article>
  </section>

  <div class="work-layout">
    <section class="core-panel">
      <div class="core-panel-head">
        <div><h2>协同任务</h2><p>先看与本人有关的工作，也可切换查看全部公开任务。</p></div>
        <div class="work-filter" role="group" aria-label="任务筛选">
          <button class="is-active" type="button" data-task-filter="mine">与我有关</button>
          <button type="button" data-task-filter="assigned">待我处理</button>
          <button type="button" data-task-filter="all">全部公开</button>
        </div>
      </div>
      <div class="work-list" id="today-task-list"></div>
    </section>

    <section class="core-panel">
      <div class="core-panel-head"><div><h2>建议与创新</h2><p>面向全体成员开放，先把想法留下，再逐步讨论、验证和形成成果。</p></div></div>
      <div class="idea-list" id="today-suggestion-list"></div>
    </section>
  </div>

  <dialog class="core-dialog" id="task-dialog">
    <form id="task-form">
      <div class="core-dialog-head"><div><span>多向协同</span><h2>布置任务</h2></div><button type="button" data-close-dialog="task-dialog" aria-label="关闭">×</button></div>
      <label><span>任务名称 *</span><input name="title" required maxlength="80" placeholder="要完成什么" /></label>
      <div class="core-form-grid">
        <label><span>交给谁 *</span><select name="assigneeId" id="task-assignee" required></select></label>
        <label><span>完成日期</span><input name="dueDate" type="date" /></label>
      </div>
      <label><span>优先级</span><select name="priority"><option value="normal">普通</option><option value="important">重要</option><option value="urgent">紧急</option></select></label>
      <label><span>任务说明</span><textarea name="description" rows="4" maxlength="500" placeholder="补充目标、背景或交付要求"></textarea></label>
      <div class="core-dialog-actions"><button class="core-button secondary" type="button" data-close-dialog="task-dialog">取消</button><button class="core-button primary" type="submit">保存任务</button></div>
    </form>
  </dialog>

  <dialog class="core-dialog" id="suggestion-dialog">
    <form id="suggestion-form">
      <div class="core-dialog-head"><div><span>全员开放</span><h2>建议与创新</h2></div><button type="button" data-close-dialog="suggestion-dialog" aria-label="关闭">×</button></div>
      <div class="core-form-grid">
        <label><span>类型</span><select name="category"><option>建议</option><option>创新</option><option>问题改善</option><option>经营想法</option></select></label>
        <label><span>主题 *</span><input name="title" required maxlength="80" placeholder="一句话说明想法" /></label>
      </div>
      <label><span>详细内容 *</span><textarea name="content" rows="6" required maxlength="1000" placeholder="说明现状、想法、预期价值或可尝试的方法"></textarea></label>
      <div class="core-dialog-actions"><button class="core-button secondary" type="button" data-close-dialog="suggestion-dialog">取消</button><button class="core-button primary" type="submit">提交想法</button></div>
    </form>
  </dialog>
</section>
