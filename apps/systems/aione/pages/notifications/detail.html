<section class="miwa-level2-page notification-detail" id="notification-detail" aria-labelledby="notification-detail-title">
  <section class="miwa-level2-head">
    <div class="miwa-level2-head__identity">
      <span class="miwa-level2-head__icon" aria-hidden="true">通</span>
      <div>
        <p class="notification-detail__eyebrow"><a href="#/notifications">通知中心</a> / 通知详情</p>
        <h1 id="notification-detail-title">通知详情</h1>
        <p id="notification-detail-description">查看正式通知内容、适用对象、时间与确认状态。</p>
      </div>
    </div>
    <div class="miwa-level2-head__actions" id="notification-detail-actions">
      <a class="miwa-level2-head__button" href="#/notifications">返回通知中心</a>
    </div>
  </section>

  <section class="miwa-level2-block" aria-labelledby="notification-detail-content-title">
    <div class="miwa-level2-block__head">
      <div><h2 id="notification-detail-content-title">通知内容</h2><p>通知正文是唯一正式内容；列表和卡片只显示摘要。</p></div>
      <span class="miwa-level2-status" id="notification-detail-status">未读</span>
    </div>
    <article class="notification-detail__content" id="notification-detail-content"></article>
  </section>

  <section class="miwa-level2-block" aria-labelledby="notification-detail-meta-title">
    <div class="miwa-level2-block__head"><div><h2 id="notification-detail-meta-title">通知信息</h2><p>发布主体、对象、时间和确认要求统一记录，方便AI秘书跟踪。</p></div></div>
    <div class="notification-detail__meta" id="notification-detail-meta"></div>
  </section>

  <section class="miwa-level2-block" id="notification-detail-action-block" aria-labelledby="notification-detail-action-title">
    <div class="miwa-level2-block__head"><div><h2 id="notification-detail-action-title">当前操作</h2><p>需要确认的通知必须明确完成“我已知悉”；只需阅读的通知打开后记为已读。</p></div></div>
    <div class="notification-detail__action-row" id="notification-detail-action-row"></div>
  </section>

  <section data-miwa-nine-elements></section>
</section>
