  <!-- 美和AI Hard Entry Bridge V1.9.9
       目的：即使模块缓存、初始化时序或AI Client异常，也必须保证Header“美和AI”先能打开独立Layer。 -->
  <script>
    (function installMiwaAIHardEntryBridge(){
      if (window.__AIONE_MIWAAI_HARD_BRIDGE__) return;
      window.__AIONE_MIWAAI_HARD_BRIDGE__ = true;
      var ENTRY_SELECTOR = '#desktop-miwa-ai-entry,#mobile-miwa-ai-entry,[data-miwa-ai-entry]';
      var pendingSource = null;
      var observer = null;

      function syncEntries(open){
        document.querySelectorAll(ENTRY_SELECTOR).forEach(function(button){
          button.classList.toggle('is-active', !!open);
          button.setAttribute('aria-expanded', String(!!open));
        });
      }

      function hardOpen(source){
        var root = document.getElementById('miwa-ai-layer');
        if (!root){
          pendingSource = source || 'header-hard-bridge';
          var host = document.getElementById('miwa-ai-layer-host');
          if (!host) return false;
          if (!observer){
            observer = new MutationObserver(function(){
              if (!document.getElementById('miwa-ai-layer')) return;
              observer.disconnect(); observer = null;
              var next = pendingSource; pendingSource = null;
              hardOpen(next);
            });
            observer.observe(host,{childList:true,subtree:true});
          }
          return false;
        }
        root.hidden = false;
        root.setAttribute('data-mode','drawer');
        root.setAttribute('data-hard-open','true');
        document.body.classList.add('miwa-ai-open');
        syncEntries(true);
        try {
          if (window.MIWAAI && typeof window.MIWAAI.open === 'function') {
            window.MIWAAI.open(source || 'header-hard-bridge');
          }
        } catch (error) {
          console.error('[美和AI Hard Bridge] 增强初始化失败，但Layer已强制打开。', error);
        }
        return true;
      }

      function hardClose(){
        var root = document.getElementById('miwa-ai-layer');
        if (!root) return false;
        root.hidden = true;
        root.removeAttribute('data-hard-open');
        document.body.classList.remove('miwa-ai-open');
        syncEntries(false);
        return true;
      }

      document.addEventListener('click', function(event){
        var target = event.target;
        if (!(target instanceof Element)) return;
        var entry = target.closest(ENTRY_SELECTOR);
        if (entry){
          event.preventDefault();
          hardOpen(entry.id && entry.id.indexOf('mobile') === 0 ? 'mobile-header-hard' : 'desktop-header-hard');
          return;
        }
        var close = target.closest('[data-miwa-ai-action="close"]');
        if (close && document.getElementById('miwa-ai-layer')){
          event.preventDefault();
          hardClose();
        }
      }, true);

      window.AIONEMiwaAIHardBridge = Object.freeze({open:hardOpen,close:hardClose});
    })();
  </script>
