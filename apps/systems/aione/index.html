<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#176B4D">
  <meta name="color-scheme" content="light">
  <title>美和AIONE一体化工作平台｜01 选品工作台</title>

  <!-- 公共システム総入口 -->
  <link rel="stylesheet" href="./css/miwa-system.css">

  <!-- 01 選品ワークベンチMain -->
  <link rel="stylesheet" href="./css/pages/selection-workbench.css">
  <link rel="stylesheet" href="./css/pages/selection-record-preview.css">
  <link rel="stylesheet" href="./css/pages/selection-guidance.css">
</head>
<body>
  <div id="app" class="app-shell">
    <div id="mobile-topbar-host"></div>
    <div id="mobile-info-host"></div>
    <div id="desktop-header-host"></div>

    <div class="app-body has-aside">
      <aside id="sidebar-host" class="desktop-sidebar-host"></aside>

      <main class="app-main">
        <div id="selection-main-host" class="page-host"></div>
      </main>

      <aside id="aside-host" class="desktop-aside-host"></aside>
    </div>

    <div id="desktop-footer-host"></div>
    <div id="mobile-bottom-host"></div>
    <div id="mobile-drawer-host"></div>
    <div id="global-settings-host"></div>
  </div>

  <!-- Excel解析｜SheetJS Community Edition 0.20.3 -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

  <!-- 公共システムJS総入口 -->
  <script type="module" src="./js/miwa-system.js"></script>
</body>
</html>
