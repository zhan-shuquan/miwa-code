<section class="aione-preview-auth" id="aionePreviewAuth" aria-labelledby="aionePreviewAuthTitle">
  <div class="aione-preview-auth__card">
    <div class="aione-preview-auth__brand">
      <span class="aione-preview-auth__mark">AIONE</span>
      <span>AI驱动的一体化平台之家</span>
    </div>

    <h1 id="aionePreviewAuthTitle">AIONE 内测入口</h1>
    <p class="aione-preview-auth__lead">使用已加入内测名单的Google账号登录，进入完整AIONE平台。</p>

    <div class="aione-preview-auth__notice">
      <strong>当前内测：全平台开放</strong>
      <span>登录身份用于把任务、工作量、结果、协作、AI使用与后续考核数据归属到正确成员；当前不按岗位限制业务平台。</span>
    </div>

    <div class="aione-preview-auth__google-panel" aria-label="Google登录">
      <div class="aione-preview-auth__google-title">使用Google账号登录</div>
      <div id="aioneGoogleSignInButton" class="aione-preview-auth__google-button"></div>
      <p id="aioneGoogleAuthStatus" class="aione-preview-auth__google-status" role="status" aria-live="polite">正在加载Google登录…</p>
    </div>

    <div class="aione-preview-auth__local-fallback" id="aioneLocalIdentityFallback" hidden>
      <div class="aione-preview-auth__divider"><span>本地开发备用身份</span></div>
      <div class="aione-preview-auth__accounts" id="aionePreviewAccounts"></div>
    </div>

    <p class="aione-preview-auth__footnote">Google登录当前用于AIONE内部预演身份识别；正式生产阶段再接入服务端Token验证与更细粒度权限。</p>
  </div>
</section>
