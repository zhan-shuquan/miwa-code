<header class="desktop-header" data-component="miwa-system-header">
  <!-- 第1层：AIONE工作上下文链。顺序锁定：公司 -> 事业 -> 用户 -> 工作 -> 时间 -> 核心之家 -> 全局工具。 -->
  <div class="miwa-header-main">
    <div class="miwa-header-main__inner" data-platform-context-order="company business person work time execution">
      <section class="miwa-brand-system" data-context-stage="company" aria-label="公司与平台">
        <a class="miwa-brand-link" href="#/company" data-header-route="company" aria-label="打开美和之家">
          <span class="miwa-logo-button">
            <img id="miwaCompanyLogo" class="miwa-company-logo" src="./assets/brand/miwa-commerce-logo.png" alt="美和正式Logo" />
            <span class="miwa-logo-fallback" id="miwaLogoFallback" hidden>MIWA</span>
          </span>
          <span class="miwa-system-brand">
            <span class="miwa-system-brand__name" id="miwaSystemShortName">AIONE</span>
            <span class="miwa-system-brand__formal" id="miwaSystemFormalName">美和一体化工作平台</span>
          </span>
        </a>
      </section>

      <section class="miwa-business-context" data-context-stage="business" aria-label="事业之家">
  <a class="miwa-business-context__button" href="#/business-home" data-header-route="business-home" aria-label="打开事业之家">
    <span class="miwa-business-context__copy"><small>事业</small><strong>事业之家</strong></span>
    <span class="miwa-semantic-icon miwa-chevron" data-icon="apps" aria-hidden="true"></span>
  </a>
</section>

      <section class="miwa-user-identity" data-context-stage="person" aria-label="当前用户">
        <button class="miwa-user-identity__button" id="desktop-employee-entry" type="button" aria-haspopup="dialog" aria-expanded="false">
          <span class="miwa-user-avatar" id="desktop-user-avatar">占</span>
          <span class="miwa-user-line"><strong id="desktop-user-name">占树全</strong><span class="miwa-grade-badge" id="desktop-position-grade">P9</span></span>
          <span class="miwa-semantic-icon miwa-chevron" data-icon="chevronDown"></span>
        </button>
        <div class="miwa-user-menu" id="desktop-user-menu" hidden>
          <div class="miwa-user-menu__head">
            <span class="miwa-user-menu__avatar miwa-user-avatar" id="desktop-user-menu-avatar">占</span>
            <span class="miwa-user-menu__identity"><span class="miwa-user-menu__name-line"><strong id="desktop-user-menu-name">当前用户</strong><span class="miwa-grade-badge" id="desktop-user-menu-grade">P9</span></span><span class="miwa-user-online">当前在线</span></span>
          </div>
          <dl class="miwa-user-details">
            <div class="miwa-user-detail-row" data-user-detail="position"><dt>主要岗位</dt><dd id="desktop-user-menu-position"></dd></div>
            <div class="miwa-user-detail-row" data-user-detail="responsibility"><dt>主要职责</dt><dd id="desktop-user-menu-responsibility"></dd></div>
            <div class="miwa-user-detail-row" data-user-detail="project"><dt>主要项目</dt><dd id="desktop-user-menu-project"></dd></div>
            <div class="miwa-user-detail-row" data-user-detail="entity"><dt>所属主体</dt><dd id="desktop-user-menu-entity"></dd></div>
            <div class="miwa-user-detail-row" data-user-detail="email"><dt>登录账号</dt><dd id="desktop-user-menu-email"></dd></div>
          </dl>
          <div class="miwa-user-menu__actions"><button class="miwa-user-menu__item" id="desktop-user-profile" type="button">个人资料</button><button class="miwa-user-menu__item is-danger" id="desktop-user-logout" type="button">退出登录</button></div>
        </div>
      </section>

      <nav class="miwa-context-actions" aria-label="工作与时间">
        <a class="miwa-nav-item miwa-nav-item--context" href="#/work-today" data-header-route="work" data-context-stage="work"><span class="miwa-semantic-icon" data-icon="work"></span><span>工作之家</span><span class="miwa-nav-badge" id="desktop-work-count" hidden>0</span></a>
        <a class="miwa-nav-item miwa-nav-item--context" href="#/calendar" data-header-route="calendar" data-context-stage="time"><span class="miwa-semantic-icon" data-icon="calendar"></span><span>美和日历</span></a>
      </nav>

      <section class="miwa-core-nav-shell" aria-label="核心之家导航">
        <button class="miwa-header-rail-button miwa-header-rail-button--prev" id="desktop-core-home-prev" type="button" data-header-rail-scroll="prev" data-header-rail-target="desktop-core-home-rail" aria-label="向左浏览核心导航" hidden>‹</button>
        <nav class="miwa-primary-nav miwa-primary-nav--global" id="desktop-core-home-rail" aria-label="核心之家">
          <a class="miwa-nav-item" href="#/talent-home" data-header-route="talent-home"><span class="miwa-semantic-icon" data-icon="talent"></span><span>人才之家</span></a>
          <a class="miwa-nav-item" href="#/ai-home" data-header-route="ai-home"><span class="miwa-semantic-icon" data-icon="ai"></span><span>AI之家</span></a>
          <span class="miwa-nav-divider" aria-hidden="true"></span>
          <a class="miwa-nav-item" href="#/customer-home" data-header-route="customer-home"><span class="miwa-semantic-icon" data-icon="customer"></span><span>客户之家</span></a>
          <a class="miwa-nav-item" href="#/supplier-home" data-header-route="supplier-home"><span class="miwa-semantic-icon" data-icon="supplier"></span><span>供应商之家</span></a>
          <span class="miwa-nav-divider" aria-hidden="true"></span>
          <a class="miwa-nav-item" href="#/product-home" data-header-route="product-home"><span class="miwa-semantic-icon" data-icon="product"></span><span>商品之家</span></a>
          <a class="miwa-nav-item" href="#/channel-home" data-header-route="channel-home"><span class="miwa-semantic-icon" data-icon="store"></span><span>渠道之家</span></a>
          <span class="miwa-nav-divider" aria-hidden="true"></span>
          <a class="miwa-nav-item" href="#/finance-home" data-header-route="finance-home"><span class="miwa-semantic-icon" data-icon="income"></span><span>财务之家</span></a>
          <a class="miwa-nav-item" href="#/analysis" data-header-route="analysis"><span class="miwa-semantic-icon" data-icon="analysis"></span><span>分析之家</span></a>
          <a class="miwa-nav-item" href="#/knowledge-home" data-header-route="knowledge-home"><span class="miwa-semantic-icon" data-icon="knowledge"></span><span>知识之家</span></a>
        </nav>
        <button class="miwa-header-rail-button miwa-header-rail-button--next" id="desktop-core-home-next" type="button" data-header-rail-scroll="next" data-header-rail-target="desktop-core-home-rail" aria-label="向右浏览核心导航" hidden>›</button>
        <div class="miwa-more-homes" id="desktop-more-homes" hidden>
          <button class="miwa-nav-item miwa-more-homes__button" id="desktop-more-homes-entry" type="button" aria-haspopup="menu" aria-expanded="false"><span class="miwa-semantic-icon" data-icon="more"></span><span>更多</span></button>
          <div class="miwa-more-homes__menu" id="desktop-more-homes-menu" role="menu" hidden></div>
        </div>
      </section>

      <section class="miwa-global-tools" aria-label="全局通用工具区">
        <label class="miwa-global-search" for="desktop-search-input"><span class="miwa-semantic-icon" data-icon="search"></span><input id="desktop-search-input" type="search" placeholder="全局搜索" autocomplete="off" aria-label="全局搜索" /></label>
        <button class="miwa-ai-header-entry" id="desktop-miwa-ai-entry" data-miwa-ai-entry="desktop" type="button" onclick="window.AIONEMiwaAIHardBridge?.open('desktop-inline')" aria-haspopup="dialog" aria-expanded="false" title="美和AI" aria-label="打开美和AI">
          <span class="miwa-ai-mini-mark" aria-hidden="true"><svg viewBox="0 0 36 36"><path d="M6 26V10l6.5 9L18 10l5.5 9L30 10v16"></path><circle cx="18" cy="8" r="2.8"></circle></svg></span><span class="miwa-ai-header-entry__label">美和AI</span>
        </button>
        <a class="miwa-tool-button miwa-tool-notification" href="#/notifications" data-header-route="notifications" title="通知" aria-label="通知"><span class="miwa-semantic-icon" data-icon="notification"></span><span class="miwa-notification-badge" id="desktop-notification-count" hidden>0</span></a>
        <a class="miwa-tool-button" href="#/knowledge-home?type=帮助中心" title="帮助中心" aria-label="帮助中心"><span class="miwa-semantic-icon" data-icon="help"></span></a>
        <a class="miwa-tool-button" href="#/settings" data-header-route="settings" title="设置" aria-label="设置"><span class="miwa-semantic-icon" data-icon="settings"></span></a>
      </section>
    </div>
  </div>

  <!-- 第2层：快捷入口。底层由共享资源注册表驱动，前台只展示快捷按钮、分隔符与“更多”。 -->
  <div class="miwa-common-entry-row" aria-label="快捷入口">
    <div class="miwa-common-entry-row__inner" data-common-entry-group="shared-resources">
      <button class="miwa-header-rail-button miwa-quick-rail-button miwa-quick-rail-button--prev" id="desktop-quick-access-prev" type="button" data-header-rail-scroll="prev" data-header-rail-target="desktop-quick-access-rail" aria-label="向左浏览快捷入口" hidden>‹</button>
      <div class="miwa-quick-access-viewport" id="desktop-quick-access-rail">
        <div class="miwa-entry-list miwa-entry-list--auto" id="desktop-quick-resource-entries" data-quick-resource-list></div>
      </div>
      <button class="miwa-header-rail-button miwa-quick-rail-button miwa-quick-rail-button--next" id="desktop-quick-access-next" type="button" data-header-rail-scroll="next" data-header-rail-target="desktop-quick-access-rail" aria-label="向右浏览快捷入口" hidden>›</button>
      <span class="miwa-common-entry-divider miwa-quick-more-divider" aria-hidden="true"></span>
      <a class="miwa-quick-more-entry" href="#/shared-home" data-header-route="shared-home" aria-label="打开更多快捷入口"><span class="miwa-semantic-icon" data-icon="apps"></span><span>更多</span></a>
    </div>
  </div>

  <!-- 第3层：美和精神。保留在全局层，内容继续由统一配置提供。 -->
  <div class="miwa-spirit-row" aria-label="美和精神">
    <div class="miwa-spirit-row__inner">
      <button class="miwa-spirit-master" type="button" data-spirit="miwa-spirit">
        <span class="miwa-spirit-master__mark" aria-hidden="true"></span><span>美和精神</span>
      </button>
      <section class="miwa-spirit-group" aria-label="核心准则">
        <button class="miwa-spirit-group__label" type="button" data-spirit="core-principles">核心准则</button>
        <div class="miwa-spirit-group__items">
          <button type="button" data-spirit="integration">一体化</button><span>→</span>
          <button type="button" data-spirit="standardization">标准化</button><span>→</span>
          <button type="button" data-spirit="process">流程化</button><span>→</span>
          <button type="button" data-spirit="automation">自动化</button>
        </div>
      </section>
      <section class="miwa-spirit-group" aria-label="三大基石">
        <button class="miwa-spirit-group__label" type="button" data-spirit="foundations">三大基石</button>
        <div class="miwa-spirit-group__items">
          <button type="button" data-spirit="miwa-principles">美和准则</button>
          <button type="button" data-spirit="miwa-soul">美和灵魂</button>
          <button type="button" data-spirit="miwa-heritage">美和传承</button>
        </div>
      </section>
      <section class="miwa-spirit-group" aria-label="三大属性">
        <button class="miwa-spirit-group__label" type="button" data-spirit="attributes">三大属性</button>
        <div class="miwa-spirit-group__items">
          <button type="button" data-spirit="universality">普适性</button>
          <button type="button" data-spirit="openness">开放性</button>
          <button type="button" data-spirit="sharing">共享性</button>
        </div>
      </section>
    </div>
  </div>

  <!-- 第4层：今日印象｜重要日程｜通知。节气/星座不再占用Header。 -->
  <div class="miwa-daily-row">
    <div class="miwa-daily-row__inner">
      <div class="miwa-daily-fixed" aria-label="今日印象">
        <span class="miwa-daily-label">今日印象</span>
        <span class="miwa-daily-location" id="miwaDailyLocation">东京</span>
        <span class="miwa-daily-separator" aria-hidden="true"></span>
        <span><strong id="miwaSolarDate">--</strong> <span id="miwaWeekday">--</span> <span id="miwaLocalTime">--:--</span></span>
        <span class="miwa-daily-separator" aria-hidden="true"></span>
        <span>农历 <strong id="miwaLunarDate">--</strong></span>
      </div>
      <button class="miwa-dynamic-signal miwa-dynamic-schedule" id="miwaDynamicSchedule" type="button" data-action="important-schedule" aria-label="查看重要日程">
        <span class="miwa-dynamic-signal__type">重要日程</span>
        <span class="miwa-dynamic-signal__text" id="miwaScheduleText">暂无重要日程</span>
      </button>
      <button class="miwa-dynamic-signal miwa-dynamic-notice" id="miwaDynamicNotice" type="button" data-action="notice-detail" aria-label="查看通知中心">
        <span class="miwa-dynamic-signal__type" id="miwaNoticeType">重要通知</span>
        <span class="miwa-dynamic-signal__text" id="miwaNoticeText">暂无重要通知</span>
      </button>
    </div>
  </div>
</header>

<div class="miwa-header-info-overlay" id="miwaHeaderInfoOverlay" hidden></div>
<section class="miwa-header-info-drawer" id="miwaHeaderInfoDrawer" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="miwaHeaderInfoTitle">
  <div class="miwa-header-info-drawer__head">
    <div><span id="miwaHeaderInfoKicker">美和精神</span><h2 id="miwaHeaderInfoTitle">美和精神</h2></div>
    <button type="button" data-action="header-info-close" aria-label="关闭">×</button>
  </div>
  <div class="miwa-header-info-drawer__body">
    <p id="miwaHeaderInfoDescription"></p>
    <section><h3>在当前系统中的体现</h3><p id="miwaHeaderInfoPractice"></p></section>
  </div>
</section>
