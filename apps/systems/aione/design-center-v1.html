<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>美和AIONE一体化工作平台｜设计中心 V2</title>
  <link rel="stylesheet" href="./css/pages/design-center-v1.css?v=20260913-v5">
  <style>
    body{margin:0;background:#f7f8f7}
    .dc-preview-shell{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #e3e7e4;background:#fff;font:14px Arial,"Microsoft YaHei",sans-serif;position:sticky;top:0;z-index:10}
    .dc-preview-shell b{font-size:18px}.dc-preview-shell span{color:#6b7280;font-size:12px}
    .dc-snapshot-badge{display:none;margin-left:10px;padding:4px 8px;border-radius:999px;background:#eef5ef;color:#31583a;font-size:11px;font-weight:700}
    body[data-snapshot="true"] .dc-snapshot-badge{display:inline-block}
  </style>
</head>
<body>
  <header class="dc-preview-shell">
    <div><b>AIONE</b><span class="dc-snapshot-badge">MH0000002 · 验收快照 · 不写数据库</span></div>
    <span>设计中心 V2 · 8类图片工作流 + Design Engine + 人工验收</span>
  </header>
  <main id="app-main-host"></main>
  <script type="module">
    const params=new URLSearchParams(window.location.search);
    const snapshotMode=params.get("snapshot")==="1";

    if(snapshotMode){
      document.body.dataset.snapshot="true";
      const nativeFetch=window.fetch.bind(window);
      let snapshotPayload=null;
      let layoutTemplate=null;
      const pageSpecs=new Map();

      async function getSnapshot(){
        if(snapshotPayload) return snapshotPayload;
        const response=await nativeFetch("./pages/design-center/mh0000002-preview.json?v=20260913-v3",{cache:"no-store"});
        if(!response.ok) throw new Error(`Snapshot load failed: ${response.status}`);
        snapshotPayload=await response.json();
        if(snapshotPayload?.workbench?.heroSpec && !snapshotPayload.workbench.heroSpec.layout_adjustments){
          snapshotPayload.workbench.heroSpec.layout_adjustments={modelScale:100,modelOffsetX:0,modelOffsetY:0,tagScale:100,tagOffsetX:0,tagOffsetY:0,productScale:100,productOffsetX:0,productOffsetY:0,primaryScale:100,primaryOffsetX:0,primaryOffsetY:0,secondaryOffsetX:0,secondaryOffsetY:0};
        }
        return snapshotPayload;
      }

      function jsonResponse(value,status=200){return new Response(JSON.stringify(value),{status,headers:{"Content-Type":"application/json; charset=utf-8","Cache-Control":"no-store"}})}
      function requestUrl(input){if(typeof input==="string") return input;if(input instanceof URL) return input.toString();return input?.url || ""}
      function pageTypeFromUrl(url){const match=url.match(/\/design\/pages\/([^/?#]+)/);return match?decodeURIComponent(match[1]):null}

      window.fetch=async function(input,init={}){
        const url=requestUrl(input);
        const method=String(init?.method || input?.method || "GET").toUpperCase();
        if(url.includes("/api/v1/design-center/workbench")) return jsonResponse(await getSnapshot());
        if(url.includes("/api/v1/design-center/layout-templates") && method==="GET") return jsonResponse({templates:layoutTemplate?[layoutTemplate]:[]});
        if(url.includes("/api/v1/design-center/layout-templates") && method==="POST"){
          const body=JSON.parse(init.body || "{}");
          layoutTemplate={id:"layouttpl_preview_mens_socks_v1",template_code:body.templateCode,name:body.name,version:body.version||"1.0",page_type:body.pageType||"hero",category_scope:body.categoryScope||null,layout_adjustments:body.layoutAdjustments||{},source_hero_spec_id:body.sourceHeroSpecId||null,lifecycle_status:"active"};
          return jsonResponse({template:layoutTemplate});
        }
        if(/\/api\/v1\/products\/[^/]+\/design\/tag-card/.test(url) && method==="PATCH"){
          const snapshot=await getSnapshot();const body=JSON.parse(init.body || "{}");const existing=snapshot.workbench.tagCard || {};
          snapshot.workbench.tagCard={...existing,id:existing.id || "tagcard_preview_mh0000002",template_preset_id:body.templatePresetId || "dip_miwa_product_tag_card_v1",brand_name_en:body.brandNameEn || "",brand_subline_en:body.brandSublineEn || "",brand_slogan_ja:body.brandSloganJa || "",color_theme:body.colorTheme || "neutral",usage_scopes:Array.isArray(body.usageScopes)?body.usageScopes:["hero","packaging"],slots:Array.isArray(body.slots)?body.slots:[],lifecycle_status:"draft"};
          return jsonResponse({tagCard:snapshot.workbench.tagCard,previewSnapshot:true});
        }
        if(/\/api\/v1\/products\/[^/]+\/design\/hero-spec/.test(url) && method==="PATCH"){
          const snapshot=await getSnapshot();const body=JSON.parse(init.body || "{}");const existing=snapshot.workbench.heroSpec || {};
          snapshot.workbench.heroSpec={...existing,id:existing.id || "herospec_preview_mh0000002",tag_card_id:body.tagCardId || snapshot.workbench.tagCard?.id || null,layout_preset_id:body.layoutPresetId || "dip_unified_hero_square_layout_v1",model_preset_id:body.modelPresetId || null,product_display_preset_id:body.productDisplayPresetId || null,model_asset_id:body.modelAssetId || null,product_display_asset_id:body.productDisplayAssetId || null,sku_asset_ids:Array.isArray(body.skuAssetIds)?body.skuAssetIds:[],product_display_mode:body.productDisplayMode || "flat_lay",primary_selling_point_binding:body.primarySellingPointBinding || {},secondary_selling_point_binding:body.secondarySellingPointBinding || {},layout_adjustments:body.layoutAdjustments || existing.layout_adjustments || {},lifecycle_status:"draft"};
          return jsonResponse({heroSpec:snapshot.workbench.heroSpec,previewSnapshot:true});
        }
        if(/\/api\/v1\/products\/[^/]+\/design\/pages\//.test(url)){
          const pageType=pageTypeFromUrl(url);
          if(method==="GET") return jsonResponse({pageSpec:pageSpecs.get(pageType)||null,previewSnapshot:true});
          if(method==="PATCH"){
            const body=JSON.parse(init.body || "{}");
            const spec={id:`pagespec_preview_${pageType}`,page_type:pageType,template_id:body.templateId||null,field_bindings:body.fieldBindings||{},asset_ids:Array.isArray(body.assetIds)?body.assetIds:[],layout_adjustments:body.layoutAdjustments||{},presentation:body.presentation||{},lifecycle_status:body.lifecycleStatus||"draft",metadata:body.metadata||{}};
            pageSpecs.set(pageType,spec);
            return jsonResponse({pageSpec:spec,previewSnapshot:true});
          }
        }
        if(/\/api\/v1\/products\/[^/]+\/design\/tasks/.test(url) && method==="POST"){
          const body=JSON.parse(init.body || "{}");
          return jsonResponse({task:{id:`preview_task_${body.taskType||"design"}`,task_type:body.taskType||null,task_status:"draft",instruction_snapshot:body.instructionSnapshot||{}},previewSnapshot:true});
        }
        return nativeFetch(input,init);
      };
    }

    const host=document.getElementById("app-main-host");
    const response=await fetch("./pages/design-center/workbench.html?v=20260913-v4",{cache:"no-store"});
    host.innerHTML=await response.text();

    const { initDesignCenter } = await import("./js/pages/design-center-v1.js?v=20260913-v5");
    await initDesignCenter();
    const { initDesignCenterPagePlan } = await import("./js/pages/design-center-page-plan-v1.js?v=20260913-v3");
    initDesignCenterPagePlan();
    const { initDesignCenterLayoutAdjustments } = await import("./js/pages/design-center-layout-v1.js?v=20260913-v2");
    await initDesignCenterLayoutAdjustments();

    const modules=[
      ["./js/pages/design-center-sku-v1.js?v=20260913-v1","initDesignCenterSkuV1"],
      ["./js/pages/design-center-white-bg-v1.js?v=20260913-v1","initDesignCenterWhiteBgV1"],
      ["./js/pages/design-center-model-v1.js?v=20260913-v1","initDesignCenterModelV1"],
      ["./js/pages/design-center-material-v1.js?v=20260913-v1","initDesignCenterMaterialV1"],
      ["./js/pages/design-center-size-v1.js?v=20260913-v1","initDesignCenterSizeV1"],
      ["./js/pages/design-center-spec-v1.js?v=20260913-v1","initDesignCenterSpecV1"],
      ["./js/pages/design-center-detail-v1.js?v=20260913-v1","initDesignCenterDetailV1"],
      ["./js/pages/design-center-generation-review-v1.js?v=20260913-v1","initDesignCenterGenerationReviewV1"]
    ];
    for(const [path,fn] of modules){
      const mod=await import(path);
      if(typeof mod[fn]==="function") await mod[fn]();
    }
    const { initDesignCenterLiveAssetPreviewV1 } = await import("./js/pages/design-center-live-asset-preview-v1.js?v=20260913-v1");
    initDesignCenterLiveAssetPreviewV1();
  </script>
</body>
</html>
