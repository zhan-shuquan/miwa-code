<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIONE｜商品中心对象工作区 V2</title>
<style>
:root{--miwa:#176b4d;--miwa-soft:#eaf4ef;--bg:#f7f9f8;--line:#e2e8e5;--text:#1f352c;--muted:#6c7973;--warn:#9b6500;--danger:#b3261e;--blue:#356a8a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}
.topbar{height:64px;display:flex;align-items:center;gap:14px;padding:0 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}.logo{font-size:22px;font-weight:900;color:var(--miwa);letter-spacing:.04em}.crumb{font-size:12px;color:var(--muted)}.spacer{flex:1}.topbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;color:#384b43}.topbtn.ai{background:#edf6f1;border:1px solid #cfe3d8;color:var(--miwa);font-weight:800}
.shell{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:calc(100vh - 64px)}.sidebar{background:#fff;border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}.side-head{display:flex;align-items:center;justify-content:space-between;padding:5px 9px 11px}.side-head strong{color:var(--miwa);font-size:14px}.side-head button{border:0;background:transparent;color:#7a8781;font-size:11px}.nav-group{padding:2px 0 10px;margin-bottom:8px;border-bottom:1px solid #edf1ef}.nav-group:last-of-type{border-bottom:0}.navbtn{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:transparent;padding:10px 11px;border-radius:9px;color:#3d5048;text-align:left}.navbtn.active{background:var(--miwa-soft);color:var(--miwa);font-weight:800;box-shadow:inset 3px 0 var(--miwa)}.side-footer{margin-top:8px;padding-top:10px;border-top:1px solid var(--line)}.trash{color:#59675f}.customizer{display:none;margin:8px 0 12px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fafcfb}.customizer.open{display:block}.customizer label{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:10px;color:#52625a}
.main{padding:24px 28px 70px;min-width:0}.pagehead{display:flex;align-items:flex-start;gap:16px}.pagehead h1{margin:0 0 6px;font-size:26px}.pagehead p{margin:0;color:var(--muted);font-size:12px}.home-ai{margin-left:auto;border:1px solid #cfe3d8;background:#fff;color:var(--miwa);border-radius:10px;padding:9px 12px;font-weight:800}.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);margin:22px 0 16px}.tabs button{border:0;background:transparent;padding:12px 14px;color:#66736d;font-weight:700}.tabs button.active{color:var(--miwa);border-bottom:2px solid var(--miwa)}
.toolbar{display:flex;align-items:center;gap:7px;margin-bottom:13px;flex-wrap:wrap}.toolbar input{width:250px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 12px}.tool{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 10px;color:#405149}.tool.primary{margin-left:auto;background:var(--miwa);color:#fff;border-color:var(--miwa);font-weight:800}.view-menu{display:flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:9px;background:#fff}.view-menu button{border:0;background:transparent;border-radius:6px;padding:6px 8px;color:#67746e}.view-menu button.active{background:var(--miwa-soft);color:var(--miwa);font-weight:800}
.table{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.tr{display:grid;grid-template-columns:minmax(300px,1.7fr) 95px 110px 120px 110px auto;align-items:center;gap:10px;padding:13px 15px;border-top:1px solid #edf1ef}.tr:first-child{border-top:0}.tr.head{background:#fafcfb;color:#748078;font-size:10px;font-weight:800}.product{display:flex;align-items:center;gap:11px;min-width:0}.thumb{width:52px;height:52px;border-radius:10px;background:linear-gradient(135deg,#dbe8e1,#f3f6f4);display:grid;place-items:center;font-size:21px;flex:none}.identity{min-width:0}.id{font-size:11px;color:var(--miwa);font-weight:900}.name{font-size:13px;font-weight:800;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:9px;color:var(--muted);margin-top:3px}.metric small{display:block;color:#7b8781;font-size:9px}.metric strong{display:block;margin-top:3px;font-size:12px}.status{display:inline-flex;padding:5px 8px;border-radius:999px;background:#edf6f1;color:var(--miwa);font-size:10px}.status.warn{background:#fff4e5;color:var(--warn)}.actions{display:flex;align-items:center;gap:2px}.icon{border:0;background:transparent;border-radius:7px;padding:7px;color:#64716b}.icon:hover{background:#f0f4f2;color:var(--miwa)}
.cards{display:grid;gap:13px}.cards.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}.cards.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}.cards.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}.cards.cols-6{grid-template-columns:repeat(6,minmax(0,1fr))}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}.cardtop{display:flex;gap:10px;min-width:0}.card .thumb{width:58px;height:58px}.cardmetrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:13px 0}.cardmetrics div{background:#fafcfb;border-radius:8px;padding:8px;min-width:0}.cardmetrics small{display:block;font-size:8px;color:#77837d}.cardmetrics strong{display:block;margin-top:3px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cardfoot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #edf1ef;padding-top:9px}.cols-6 .card{padding:10px}.cols-6 .card .thumb{width:44px;height:44px}.cols-6 .cardmetrics{grid-template-columns:1fr;margin:9px 0}.cols-6 .cardmetrics div:nth-child(n+2){display:none}.cols-6 .name{font-size:11px}.cols-6 .actions .icon:nth-child(-n+3){display:none}
.note{margin-top:14px;color:#78847e;font-size:10px}.sku-table .tr{grid-template-columns:minmax(250px,1.5fr) 135px 105px 105px 115px 110px auto}.sku-spec{font-size:11px;font-weight:700}.tag{display:inline-block;padding:4px 7px;border-radius:999px;background:#f1f5f3;color:#52625a;font-size:9px;margin-right:4px}
.setting-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.setting-card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px}.setting-card h3{margin:0 0 6px;font-size:14px}.setting-card p{margin:0 0 12px;color:var(--muted);font-size:10px;line-height:1.6}.setting-card button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 9px;color:var(--miwa)}
.backdrop{position:fixed;inset:0;background:rgba(23,42,34,.18);z-index:50;display:none}.backdrop.open{display:block}.drawer{position:fixed;right:0;top:0;width:min(620px,94vw);height:100vh;background:#fff;z-index:60;box-shadow:-22px 0 55px rgba(0,0,0,.14);transform:translateX(102%);transition:.2s;display:flex;flex-direction:column}.drawer.open{transform:none}.drawer-head{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}.drawer-head strong{font-size:14px}.drawer-head button{margin-left:auto;border:0;background:transparent;font-size:21px}.context-head{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line)}.context-head .thumb{width:62px;height:62px}.context-actions{margin-left:auto;display:flex;gap:5px}.context-actions button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 9px}.drawer-body{overflow:auto;padding:17px 18px}.object-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}.object-tabs button{border:0;background:transparent;padding:9px 10px;color:#69766f}.object-tabs button.active{color:var(--miwa);border-bottom:2px solid var(--miwa)}.obj-tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}.obj-tools button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 9px;font-size:10px}.section{padding:14px 0;border-top:1px solid var(--line)}.section:first-child{border-top:0}.section h4{margin:0 0 9px;font-size:13px}.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kv div{background:#fafcfb;border-radius:8px;padding:9px}.kv small{display:block;color:#7b8781;font-size:9px}.kv strong{display:block;margin-top:3px;font-size:11px}.mini-skus{display:grid;gap:7px}.mini-sku{display:grid;grid-template-columns:110px 1fr 90px 75px;gap:8px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:9px}.mini-sku b{color:var(--miwa);font-size:10px}.mini-sku span{font-size:10px}
.modal{position:fixed;inset:6vh auto auto 50%;transform:translateX(-50%);width:min(860px,94vw);max-height:88vh;overflow:auto;background:#fff;border-radius:16px;z-index:70;box-shadow:0 24px 70px rgba(0,0,0,.2);display:none}.modal.open{display:block}.modal-head{display:flex;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:18px}.modal-head button{margin-left:auto;border:0;background:transparent;font-size:22px}.steps{display:flex;gap:6px;padding:14px 20px;border-bottom:1px solid var(--line)}.step{padding:7px 10px;border-radius:999px;background:#f2f5f3;color:#738079;font-size:10px}.step.active{background:var(--miwa-soft);color:var(--miwa);font-weight:800}.modal-body{padding:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:10px;color:#65736c}.field input,.field select{border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:#fff}.full{grid-column:1/-1}.generator{border:1px solid #cfe3d8;background:#fbfdfc;border-radius:13px;padding:15px;margin-top:12px}.generator h3{margin:0 0 5px;color:var(--miwa);font-size:14px}.generator p{margin:0 0 12px;color:var(--muted);font-size:10px}.variants{display:grid;grid-template-columns:140px 1fr;gap:8px;align-items:start}.variants b{font-size:10px;padding-top:7px}.variant-values{display:flex;gap:6px;flex-wrap:wrap}.variant-values span{padding:6px 8px;border-radius:8px;background:#fff;border:1px solid var(--line);font-size:10px}.generator-result{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.generator-result strong{color:var(--miwa)}.preview-skus{margin-top:8px;display:grid;gap:5px}.preview-sku{display:grid;grid-template-columns:120px 1fr 100px 110px;gap:8px;padding:7px 9px;background:#fff;border:1px solid var(--line);border-radius:8px;font-size:10px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}.modal-actions button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px}.modal-actions .primary{background:var(--miwa);color:#fff;border-color:var(--miwa)}
@media(max-width:1180px){.shell{grid-template-columns:184px 1fr}.tr{grid-template-columns:minmax(260px,1.6fr) 90px 100px 100px auto}.tr .hide-md{display:none}.cards.cols-6{grid-template-columns:repeat(4,minmax(0,1fr))}.setting-grid{grid-template-columns:1fr 1fr}}@media(max-width:850px){.shell{grid-template-columns:1fr}.sidebar{display:none}.main{padding:20px}.cards.cols-3,.cards.cols-4,.cards.cols-6{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar .primary{margin-left:0}.setting-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar"><div class="logo">AIONE</div><div class="crumb">商品之家 › 商品中心预览 V2</div><div class="spacer"></div><button class="topbtn">⌕ 全局搜索</button><button class="topbtn ai">✦ 美和AI</button></header>
<div class="shell">
<aside class="sidebar">
  <div class="side-head"><strong>商品之家</strong><button id="customizeBtn">自定义</button></div>
  <div class="customizer" id="customizer"><label><input type="checkbox" checked data-nav-toggle="cost">成本中心</label><label><input type="checkbox" checked data-nav-toggle="price">价格中心</label><label><input type="checkbox" checked data-nav-toggle="profit">利润中心</label><label><input type="checkbox" checked data-nav-toggle="base">商品基础组</label><label><input type="checkbox" checked data-nav-toggle="operate">经营组</label></div>
  <div class="nav-group"><button class="navbtn">概览</button></div>
  <div class="nav-group"><button class="navbtn">选品中心</button><button class="navbtn active" data-center="product">商品中心</button><button class="navbtn">设计中心</button><button class="navbtn">发布中心</button></div>
  <div class="nav-group"><button class="navbtn" data-center="cost" data-nav="cost">成本中心</button><button class="navbtn" data-center="price" data-nav="price">价格中心</button><button class="navbtn" data-nav="profit">利润中心</button></div>
  <div class="nav-group" data-nav-group="base"><button class="navbtn">分类中心</button><button class="navbtn">品牌中心</button><button class="navbtn">属性中心</button><button class="navbtn">规格中心</button><button class="navbtn">编码中心</button></div>
  <div class="nav-group" data-nav-group="operate"><button class="navbtn">测样中心</button><button class="navbtn">采购中心</button><button class="navbtn">库存中心</button><button class="navbtn">运营中心</button><button class="navbtn">客服中心</button></div>
  <div class="side-footer"><button class="navbtn trash">回收站</button></div>
</aside>
<main class="main">
  <div class="pagehead"><div><h1 id="centerTitle">商品中心</h1><p id="centerDesc">正式 Product / SKU 的统一事实入口。Product 与 SKU 都是完整业务对象。</p></div><button class="home-ai">✦ 商品之家AI秘书</button></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="toolbar" id="toolbar"></div>
  <div id="content"></div>
  <div class="note">对象能力不因列表 / 卡片视图而减少；导入导出属于中心级操作；中心不单独创建 AI，统一由美和AI与商品之家AI秘书读取当前中心和对象上下文。</div>
</main>
</div>
<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer"><div class="drawer-head"><strong>完整对象工作区</strong><button id="drawerClose">×</button></div><div id="drawerContent"></div></aside>
<div class="modal" id="newProductModal"><div class="modal-head"><h2>新建正式商品</h2><button id="modalClose">×</button></div><div class="steps"><span class="step active">1 商品建立</span><span class="step">2 SKU确认</span><span class="step">3 完成</span></div><div class="modal-body" id="modalBody"></div><div class="modal-actions" id="modalActions"></div></div>
<script>
const products=[
{id:'MH0000128',name:'男士厚手格纹中筒袜 5双装',category:'0105 男袜',skuCount:5,defaultSku:'MH0000128-01',status:'准备中',owner:'占树全',cost:'¥730',price:'¥1,480',margin:'50.7%',source:'1688',ver:'COST-V12'},
{id:'MH0000129',name:'女士棉混中筒袜',category:'0104 女袜',skuCount:3,defaultSku:'MH0000129-01',status:'待确认',owner:'小于',cost:'¥468',price:'¥980',margin:'52.2%',source:'1688',ver:'COST-V09'},
{id:'MH0000130',name:'男士商务中筒袜 5双装',category:'0105 男袜',skuCount:4,defaultSku:'MH0000130-01',status:'可发布',owner:'占树全',cost:'¥690',price:'¥1,380',margin:'50.0%',source:'1688',ver:'COST-V11'}
];
const skus=[
{id:'MH0000128-01',product:'MH0000128',name:'男士厚手格纹中筒袜 黑色',spec:'黑色 · 24–27cm · 5双装',origin:'中国',code:'JAN待分配',image:'黑色图',status:'准备中'},
{id:'MH0000128-02',product:'MH0000128',name:'男士厚手格纹中筒袜 蓝色',spec:'蓝色 · 24–27cm · 5双装',origin:'中国',code:'JAN待分配',image:'蓝色图',status:'准备中'},
{id:'MH0000128-03',product:'MH0000128',name:'男士厚手格纹中筒袜 灰色',spec:'灰色 · 24–27cm · 5双装',origin:'中国',code:'JAN待分配',image:'灰色图',status:'准备中'},
{id:'MH0000128-04',product:'MH0000128',name:'男士厚手格纹中筒袜 棕色',spec:'棕色 · 24–27cm · 5双装',origin:'中国',code:'JAN待分配',image:'棕色图',status:'准备中'},
{id:'MH0000128-05',product:'MH0000128',name:'男士厚手格纹中筒袜 绿色',spec:'绿色 · 24–27cm · 5双装',origin:'中国',code:'JAN待分配',image:'绿色图',status:'准备中'},
{id:'MH0000129-01',product:'MH0000129',name:'女士棉混中筒袜 黑色',spec:'黑色 · 23–25cm',origin:'中国',code:'JAN待分配',image:'黑色图',status:'待确认'}
];
let center='product',tab='products',view='card',cols=3,modalStep=1;
const cfg={
product:{title:'商品中心',desc:'正式 Product / SKU 的统一事实入口。Product 与 SKU 都是完整业务对象。',tabs:[['products','全部商品'],['sku','SKU'],['setting','设置']]},
cost:{title:'成本中心',desc:'沿用既有成本试算逻辑，统一计算、保存和解释单件销售成本。',tabs:[['products','成本试算'],['history','成本记录'],['setting','设置']]},
price:{title:'价格中心',desc:'读取成本事实与定价参数，输出建议售价、最低保本价、活动价与渠道价格。',tabs:[['products','智能定价'],['history','价格记录'],['setting','设置']]}
};
function objectActions(id){return `<div class="actions"><button class="icon" title="编辑" data-open="${id}">✎</button><button class="icon" title="评论">☰</button><button class="icon" title="关注">☆</button><button class="icon" title="附件">⌕</button><button class="icon" title="更多" data-open="${id}">⋮</button></div>`}
function tabsHtml(){return cfg[center].tabs.map(([id,label])=>`<button data-tab="${id}" class="${tab===id?'active':''}">${label}</button>`).join('')}
function toolbarHtml(){if(tab==='setting')return `<button class="tool">导入设置</button><button class="tool">导出设置</button>`;const density=view==='card'?`<div class="view-menu"><button data-cols="2" class="${cols===2?'active':''}">2</button><button data-cols="3" class="${cols===3?'active':''}">3</button><button data-cols="4" class="${cols===4?'active':''}">4</button><button data-cols="6" class="${cols===6?'active':''}">6</button></div>`:'';const primary=center==='product'&&tab==='products'?'<button class="tool primary" id="newProduct">＋ 新建商品</button>':center==='cost'?'<button class="tool primary">重新试算</button>':center==='price'?'<button class="tool primary">重新定价</button>':'';return `<input placeholder="搜索编号 / 商品简称"><button class="tool">筛选</button><button class="tool">分组</button><button class="tool">排序</button><button class="tool" id="viewToggle">${view==='list'?'▦ 卡片':'☷ 列表'}</button>${density}<button class="tool">导入</button><button class="tool">导出</button><button class="tool">批量操作</button>${primary}`}
function productMetrics(p){if(center==='cost')return [['单件销售成本',p.cost],['参数版本',p.ver],['来源',p.source]];if(center==='price')return [['建议售价',p.price],['最低毛利率',p.margin],['成本引用',p.cost]];return [['SKU',`${p.skuCount} SKU`],['默认SKU',p.defaultSku],['负责人',p.owner]]}
function productCard(p){const m=productMetrics(p);return `<article class="card"><div class="cardtop"><div class="thumb">🧦</div><div class="identity"><div class="id">${p.id}</div><div class="name">${p.name}</div><div class="sub">${p.category}</div></div></div><div class="cardmetrics">${m.map(x=>`<div><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}</div><div class="cardfoot"><span class="status ${p.status==='待确认'?'warn':''}">${p.status}</span>${objectActions(p.id)}</div></article>`}
function productRow(p){const m=productMetrics(p);return `<div class="tr"><div class="product"><div class="thumb">🧦</div><div class="identity"><div class="id">${p.id}</div><div class="name">${p.name}</div><div class="sub">${p.category}</div></div></div>${m.map((x,i)=>`<div class="metric ${i===2?'hide-md':''}"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}<div><span class="status ${p.status==='待确认'?'warn':''}">${p.status}</span></div>${objectActions(p.id)}</div>`}
function productsView(){if(view==='card')return `<section class="cards cols-${cols}">${products.map(productCard).join('')}</section>`;return `<section class="table"><div class="tr head"><div>商品对象</div><div>${center==='product'?'SKU':center==='cost'?'单件销售成本':'建议售价'}</div><div>${center==='product'?'默认SKU':center==='cost'?'参数版本':'最低毛利率'}</div><div class="hide-md">${center==='product'?'负责人':center==='cost'?'来源':'成本引用'}</div><div>状态</div><div>对象操作</div></div>${products.map(productRow).join('')}</section>`}
function skuView(){return `<section class="table sku-table"><div class="tr head"><div>SKU对象</div><div>规格组合</div><div>原产国</div><div>JAN / GTIN</div><div>SKU图片</div><div>状态</div><div>对象操作</div></div>${skus.map(s=>`<div class="tr"><div class="product"><div class="thumb">🧦</div><div class="identity"><div class="id">${s.id}</div><div class="name">${s.name}</div><div class="sub">所属 Product：${s.product}</div></div></div><div class="sku-spec">${s.spec}</div><div><span class="tag">${s.origin}</span></div><div class="metric"><small>唯一识别</small><strong>${s.code}</strong></div><div class="metric"><small>自动关联</small><strong>${s.image}</strong></div><div><span class="status ${s.status==='待确认'?'warn':''}">${s.status}</span></div>${objectActions(s.id)}</div>`).join('')}</section><div class="note">原产国按 SKU 级保存；JAN / GTIN / EAN / UPC 属于 SKU / Product 唯一识别字段，由编码中心统一管理规则与分配状态。</div>`}
function settingsView(){const items=center==='product'?[['SKU生成规则','规格模板 + Variant Values → SKU组合 / SKU ID / 名称 / 图片 / 初始状态'],['商品建立规则','Opportunity 转正式 Product 的最低条件与编号生成规则'],['对象显示偏好','默认列表/卡片、卡片2/3/4/6列、常用对象动作']]:center==='cost'?[['成本参数','汇率、国际运费、包装成本、日本配送等'],['成本计算规则','商品销售成本 + 基础交易成本 = 单件销售成本'],['版本与审计','参数版本、生效时间、来源、修改记录']]:[['定价参数','目标利润、目标毛利率、最低毛利率、尾数规则'],['渠道定价规则','店铺 / 渠道售价策略与活动价边界'],['版本与审计','策略版本、生效时间、修改记录']];return `<section class="setting-grid">${items.map(x=>`<article class="setting-card"><h3>${x[0]}</h3><p>${x[1]}</p><button>查看设置</button></article>`).join('')}</section>`}
function historyView(){return `<section class="table"><div class="tr head"><div>对象</div><div>版本</div><div>结果</div><div class="hide-md">来源</div><div>状态</div><div>操作</div></div>${products.map(p=>`<div class="tr"><div class="product"><div class="thumb">🧦</div><div class="identity"><div class="id">${p.id}</div><div class="name">${p.name}</div></div></div><div class="metric"><small>当前版本</small><strong>${center==='cost'?p.ver:'PRICE-V08'}</strong></div><div class="metric"><small>${center==='cost'?'单件销售成本':'建议售价'}</small><strong>${center==='cost'?p.cost:p.price}</strong></div><div class="metric hide-md"><small>来源</small><strong>系统规则</strong></div><div><span class="status">已计算</span></div>${objectActions(p.id)}</div>`).join('')}</section>`}
function render(){document.getElementById('centerTitle').textContent=cfg[center].title;document.getElementById('centerDesc').textContent=cfg[center].desc;document.getElementById('tabs').innerHTML=tabsHtml();document.getElementById('toolbar').innerHTML=toolbarHtml();let html;if(tab==='setting')html=settingsView();else if(tab==='sku')html=skuView();else if(tab==='history')html=historyView();else html=productsView();document.getElementById('content').innerHTML=html;bind()}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll('[data-cols]').forEach(b=>b.onclick=()=>{cols=Number(b.dataset.cols);render()});const vt=document.getElementById('viewToggle');if(vt)vt.onclick=()=>{view=view==='list'?'card':'list';render()};document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openObject(b.dataset.open));const np=document.getElementById('newProduct');if(np)np.onclick=openNewProduct}
function openObject(id){const p=products.find(x=>x.id===id)||products.find(x=>id.startsWith(x.id));const sku=skus.find(x=>x.id===id);const isSku=!!sku;const identity=isSku?sku:p;document.getElementById('drawerContent').innerHTML=`<div class="context-head"><div class="thumb">🧦</div><div class="identity"><div class="id">${identity.id}</div><div class="name">${identity.name}</div><div class="sub">${isSku?sku.spec:p.category}</div></div><div class="context-actions"><button>编辑</button><button>状态</button><button>更多</button></div></div><div class="drawer-body"><nav class="object-tabs"><button class="active">基本资料</button><button>SKU</button><button>关联业务</button><button>时间线</button></nav><div class="obj-tools"><button>负责人</button><button>评论</button><button>@成员</button><button>关注</button><button>收藏</button><button>附件</button><button>操作记录</button><button>状态历史</button><button>关联对象</button></div>${isSku?skuDetail(sku):productDetail(p)}</div>`;document.getElementById('drawer').classList.add('open');document.getElementById('backdrop').classList.add('open')}
function productDetail(p){const own=skus.filter(s=>s.product===p.id);return `<section class="section"><h4>Product 基本资料</h4><div class="kv"><div><small>Product ID</small><strong>${p.id}</strong></div><div><small>正式商品名称</small><strong>${p.name}</strong></div><div><small>三级分类</small><strong>${p.category}</strong></div><div><small>负责人</small><strong>${p.owner}</strong></div><div><small>来源</small><strong>${p.source}</strong></div><div><small>商品状态</small><strong>${p.status}</strong></div></div></section><section class="section"><h4>SKU｜${own.length} 个</h4><div class="mini-skus">${own.map(s=>`<div class="mini-sku"><b>${s.id}</b><span>${s.spec}</span><span>${s.origin}</span><span>${s.status}</span></div>`).join('')}</div></section><section class="section"><h4>关联业务摘要</h4><div class="kv"><div><small>成本</small><strong>${p.cost}</strong></div><div><small>当前建议售价</small><strong>${p.price}</strong></div><div><small>品牌</small><strong>SOCKONE</strong></div><div><small>发布</small><strong>待发布</strong></div></div></section>`}
function skuDetail(s){return `<section class="section"><h4>SKU 标准事实</h4><div class="kv"><div><small>SKU ID</small><strong>${s.id}</strong></div><div><small>所属 Product</small><strong>${s.product}</strong></div><div><small>规格组合</small><strong>${s.spec}</strong></div><div><small>原产国 / 制造国</small><strong>${s.origin}</strong></div><div><small>JAN / GTIN</small><strong>${s.code}</strong></div><div><small>SKU图片</small><strong>${s.image}</strong></div></div></section><section class="section"><h4>业务关联</h4><div class="kv"><div><small>成本</small><strong>继承 / 可覆盖</strong></div><div><small>价格</small><strong>继承 / 可覆盖</strong></div><div><small>库存</small><strong>48</strong></div><div><small>发布状态</small><strong>待发布</strong></div></div></section>`}
function openNewProduct(){modalStep=1;renderModal();document.getElementById('newProductModal').classList.add('open');document.getElementById('backdrop').classList.add('open')}
function renderModal(){document.querySelectorAll('.step').forEach((s,i)=>s.classList.toggle('active',i===modalStep-1));const body=document.getElementById('modalBody'),actions=document.getElementById('modalActions');if(modalStep===1){body.innerHTML=`<div class="form-grid"><div class="field full"><label>来源商品机会 / 1688链接</label><input value="https://detail.1688.com/offer/example.html"></div><div class="field"><label>三级系统分类</label><select><option>0105 男袜</option></select></div><div class="field"><label>品牌</label><select><option>SOCKONE</option></select></div><div class="field full"><label>正式商品名称</label><input value="男士厚手格纹中筒袜 5双装"></div><div class="field"><label>负责人</label><input value="占树全"></div><div class="field"><label>主图</label><input value="已从来源自动关联"></div></div><div class="note">API / AI 已尽量完成来源、名称、图片、分类与基础事实整理。员工主要确认，不重复录入。</div>`;actions.innerHTML=`<button id="cancelModal">取消</button><button class="primary" id="nextModal">继续：确认SKU</button>`}else if(modalStep===2){body.innerHTML=`<div class="generator"><h3>SKU Generator｜SKU生成器</h3><p>读取三级分类对应的 Specification Template，并结合来源 API / AI 识别到的 Variant Values 自动生成 SKU 草稿。</p><div class="variants"><b>颜色</b><div class="variant-values"><span>黑色</span><span>蓝色</span><span>灰色</span><span>棕色</span><span>绿色</span></div><b>尺码</b><div class="variant-values"><span>24–27cm</span></div><b>套装数量</b><div class="variant-values"><span>5双装</span></div><b>原产国</b><div class="variant-values"><span>中国（批量应用到全部SKU）</span></div></div><div class="generator-result"><strong>将自动生成 5 个 SKU</strong><div class="preview-skus">${['黑色','蓝色','灰色','棕色','绿色'].map((c,i)=>`<div class="preview-sku"><b>MH0000131-0${i+1}</b><span>${c} · 24–27cm · 5双装</span><span>中国</span><span>${c}SKU图</span></div>`).join('')}</div></div></div><div class="note">SKU ID、SKU名称、SKU图片关联与初始状态均由生成器自动完成；JAN / GTIN 可随后调用编码中心分配。</div>`;actions.innerHTML=`<button id="prevModal">返回</button><button class="primary" id="nextModal">确认生成 5 SKU</button>`}else{body.innerHTML=`<div class="generator"><h3>商品建立完成</h3><p>Product 与 5 个 SKU 已作为正式对象建立，可继续进入成本 → 定价 → 属性 → 品牌 → 设计 → 发布流程。</p><div class="kv"><div><small>Product ID</small><strong>MH0000131</strong></div><div><small>SKU</small><strong>5 SKU</strong></div><div><small>SKU Generator</small><strong>已完成</strong></div><div><small>下一步</small><strong>成本</strong></div></div></div>`;actions.innerHTML=`<button class="primary" id="finishModal">完成</button>`}bindModal()}
function bindModal(){const c=document.getElementById('cancelModal');if(c)c.onclick=closeModal;const n=document.getElementById('nextModal');if(n)n.onclick=()=>{modalStep++;renderModal()};const p=document.getElementById('prevModal');if(p)p.onclick=()=>{modalStep--;renderModal()};const f=document.getElementById('finishModal');if(f)f.onclick=closeModal}
function closeModal(){document.getElementById('newProductModal').classList.remove('open');document.getElementById('backdrop').classList.remove('open')}
document.querySelectorAll('[data-center]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-center]').forEach(x=>x.classList.remove('active'));b.classList.add('active');center=b.dataset.center;tab='products';render()});document.getElementById('drawerClose').onclick=()=>{document.getElementById('drawer').classList.remove('open');document.getElementById('backdrop').classList.remove('open')};document.getElementById('modalClose').onclick=closeModal;document.getElementById('backdrop').onclick=()=>{document.getElementById('drawer').classList.remove('open');document.getElementById('newProductModal').classList.remove('open');document.getElementById('backdrop').classList.remove('open')};document.getElementById('customizeBtn').onclick=()=>document.getElementById('customizer').classList.toggle('open');document.querySelectorAll('[data-nav-toggle]').forEach(c=>c.onchange=()=>{const key=c.dataset.navToggle;if(key==='base'||key==='operate'){document.querySelector(`[data-nav-group="${key}"]`).style.display=c.checked?'block':'none'}else{const target=document.querySelector(`[data-nav="${key}"]`);if(target)target.style.display=c.checked?'flex':'none'}});render();
</script>
</body>
</html>
