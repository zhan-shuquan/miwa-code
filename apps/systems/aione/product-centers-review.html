<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIONE｜商品中心与成本中心对象工作区预览</title>
<style>
:root{--miwa:#176b4d;--bg:#f7f9f8;--line:#e3e9e6;--text:#23352e;--muted:#6d7a74;--warn:#b36a00;--danger:#b3261e}
*{box-sizing:border-box}body{margin:0;font-family:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}
header{height:64px;display:flex;align-items:center;gap:16px;padding:0 22px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.logo{font-weight:900;color:var(--miwa);font-size:22px}.crumb{font-size:12px;color:var(--muted)}.spacer{flex:1}.global{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px}.ai{background:#edf6f1;border:1px solid #cfe3d8;color:var(--miwa);border-radius:10px;padding:9px 12px;font-weight:800}
.layout{display:grid;grid-template-columns:218px 1fr;min-height:calc(100vh - 64px)}aside{background:#fff;border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:64px;height:calc(100vh - 64px)}aside h3{margin:4px 10px 14px;color:var(--miwa)}aside button{width:100%;text-align:left;border:0;background:transparent;padding:11px 12px;border-radius:9px;color:#3e5048;margin:2px 0}aside button.active{background:#eaf4ef;color:var(--miwa);font-weight:800;box-shadow:inset 3px 0 var(--miwa)}main{padding:26px 30px 80px;min-width:0}.pagehead{display:flex;align-items:flex-start;gap:20px}.pagehead h1{margin:0 0 6px;font-size:26px}.pagehead p{margin:0;color:var(--muted);font-size:13px}.tabs{display:flex;gap:6px;margin:24px 0 18px;border-bottom:1px solid var(--line)}.tabs button{border:0;background:transparent;padding:12px 14px;color:var(--muted);font-weight:700}.tabs button.active{color:var(--miwa);border-bottom:2px solid var(--miwa)}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px}.toolbar input{width:260px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}.toolbar button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 11px}.toolbar .primary{margin-left:auto;background:var(--miwa);color:#fff;border-color:var(--miwa)}
.object-table{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.row{display:grid;grid-template-columns:minmax(320px,1.8fr) 120px 120px 120px 1fr auto;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid #edf1ef}.row:first-child{border-top:0}.row.head{background:#fafcfb;color:var(--muted);font-size:11px;font-weight:800}.product{display:flex;align-items:center;gap:12px;min-width:0}.thumb{width:54px;height:54px;border-radius:10px;background:linear-gradient(135deg,#d8e4de,#f3f6f4);display:grid;place-items:center;font-size:22px;flex:none}.identity{min-width:0}.id{font-size:12px;color:var(--miwa);font-weight:900}.name{font-size:13px;font-weight:800;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:10px;color:var(--muted);margin-top:3px}.metric strong{display:block;font-size:14px}.metric small{color:var(--muted)}.status{font-size:11px;padding:5px 8px;border-radius:999px;background:#edf6f1;color:var(--miwa);display:inline-block}.status.warn{background:#fff4e5;color:var(--warn)}
.actions{display:flex;align-items:center;gap:4px}.iconbtn,.more{border:0;background:transparent;border-radius:8px;padding:7px 8px;color:#5f6d67;cursor:pointer}.iconbtn:hover,.more:hover{background:#f1f5f3;color:var(--miwa)}
.cardgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px}.cardtop{display:flex;gap:12px}.card .thumb{width:62px;height:62px}.card .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 12px}.card .metrics div{background:#fafcfb;border-radius:9px;padding:9px}.card .metrics small{display:block;color:var(--muted);font-size:9px}.card .metrics strong{display:block;margin-top:3px;font-size:13px}.cardactions{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #edf1ef;padding-top:10px}
.drawer{position:fixed;right:0;top:0;width:min(500px,92vw);height:100vh;background:#fff;box-shadow:-18px 0 50px rgba(0,0,0,.14);z-index:50;transform:translateX(102%);transition:.2s;display:flex;flex-direction:column}.drawer.open{transform:none}.drawerhead{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center}.drawerhead button{margin-left:auto;border:0;background:transparent;font-size:22px}.context{display:flex;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}.context .thumb{width:58px;height:58px}.drawerbody{padding:18px 20px;overflow:auto}.objecttools{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}.objecttools button{border:1px solid var(--line);background:#fff;padding:8px 10px;border-radius:9px}.section{border-top:1px solid var(--line);padding:16px 0}.section:first-child{border-top:0}.section h4{margin:0 0 10px}.kv{display:grid;grid-template-columns:1fr 1fr;gap:9px}.kv div{background:#fafcfb;border-radius:9px;padding:10px}.kv small{display:block;color:var(--muted);font-size:9px}.kv strong{display:block;margin-top:4px}.backdrop{position:fixed;inset:0;background:rgba(20,40,30,.18);z-index:40;display:none}.backdrop.open{display:block}.note{font-size:11px;color:var(--muted);margin-top:16px}.hidden{display:none!important}@media(max-width:1050px){.layout{grid-template-columns:180px 1fr}.row{grid-template-columns:minmax(280px,1.6fr) 110px 110px 1fr auto}.row .hide-md{display:none}.cardgrid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><div class="logo">AIONE</div><div class="crumb">商品之家 › 对象中心预览</div><div class="spacer"></div><button class="global">⌕ 全局搜索</button><button class="ai">✦ 美和AI</button></header>
<div class="layout">
<aside><h3>商品之家</h3><button>概览</button><button>分类中心</button><button>选品中心</button><button class="active" data-center="product">商品中心</button><button data-center="cost">成本中心</button><button data-center="price">价格中心</button><button>利润中心</button><button>属性中心</button><button>品牌中心</button><button>规格中心</button><button>设计中心</button><button>发布中心</button><hr style="border:0;border-top:1px solid var(--line);margin:12px 8px"><button>测样中心</button><button>采购中心</button><button>库存中心</button><button>运营中心</button><button>客服中心</button></aside>
<main>
<div class="pagehead"><div><h1 id="centerTitle">商品中心</h1><p id="centerDesc">正式 Product / SKU 的统一事实入口。列表与卡片只是不同 View，对象能力保持完整。</p></div></div>
<nav class="tabs" id="tabs"></nav>
<div class="toolbar"><input placeholder="搜索编号 / 商品简称"><button>筛选</button><button>分组</button><button>排序</button><button id="viewToggle">▦ 卡片</button><button>批量操作</button><button class="primary" id="primaryAction">＋ 新建商品</button></div>
<div id="content"></div>
<div class="note">预览原则：对象能力不因列表 / 卡片视图而减少；常用动作外露，低频动作进入“更多”与详情工作区。</div>
</main></div>
<div class="backdrop" id="backdrop"></div><aside class="drawer" id="drawer"><div class="drawerhead"><strong>对象工作区</strong><button id="close">×</button></div><div id="drawerContent"></div></aside>
<script>
const products=[
{id:'MH0000128',name:'男士厚手格纹中筒袜 5双装',category:'0105 男袜',sku:'5 SKU',status:'准备中',owner:'占树全',cost:'¥730',price:'¥1,480',margin:'50.7%',source:'1688',ver:'COST-V12'},
{id:'MH0000129-03',name:'女士棉混中筒袜 黑色',category:'0104 女袜',sku:'SKU级',status:'待确认',owner:'小于',cost:'¥468',price:'¥980',margin:'52.2%',source:'1688',ver:'COST-V09'},
{id:'MH0000130',name:'男士商务中筒袜 5双装',category:'0105 男袜',sku:'4 SKU',status:'可发布',owner:'占树全',cost:'¥690',price:'¥1,380',margin:'50.0%',source:'1688',ver:'COST-V11'}
];
let center='product', view='list', tab='list';
const cfg={
product:{title:'商品中心',desc:'正式 Product / SKU 的统一事实入口。列表与卡片只是不同 View，对象能力保持完整。',tabs:[['list','商品'],['record','商品记录'],['setting','设置']],primary:'＋ 新建商品'},
cost:{title:'成本中心',desc:'统一计算、保存和解释单件销售成本；沿用既有成本试算字段与逻辑。',tabs:[['list','成本试算'],['record','成本记录'],['setting','设置']],primary:'重新试算'},
price:{title:'价格中心',desc:'基于成本事实与定价规则生成建议售价、最低保本价、活动价与渠道价格。',tabs:[['list','智能定价'],['record','价格记录'],['setting','设置']],primary:'重新定价'}
};
function actions(p){return `<div class="actions"><button class="iconbtn" title="编辑" data-open="${p.id}">✎</button><button class="iconbtn" title="评论">☵</button><button class="iconbtn" title="关注">☆</button><button class="iconbtn" title="附件">⌕</button><button class="iconbtn" title="美和AI">✦</button><button class="more" title="更多" data-open="${p.id}">⋮</button></div>`}
function metricSet(p){if(center==='cost')return [`<div class="metric"><small>单件销售成本</small><strong>${p.cost}</strong></div>`,`<div class="metric"><small>参数版本</small><strong>${p.ver}</strong></div>`,`<div class="metric hide-md"><small>数据来源</small><strong>${p.source}</strong></div>`];if(center==='price')return [`<div class="metric"><small>建议售价</small><strong>${p.price}</strong></div>`,`<div class="metric"><small>最低毛利率</small><strong>${p.margin}</strong></div>`,`<div class="metric hide-md"><small>成本引用</small><strong>${p.cost}</strong></div>`];return [`<div class="metric"><small>SKU</small><strong>${p.sku}</strong></div>`,`<div class="metric"><small>负责人</small><strong>${p.owner}</strong></div>`,`<div class="metric hide-md"><small>分类</small><strong>${p.category}</strong></div>`]}
function row(p){const m=metricSet(p);return `<div class="row"><div class="product"><div class="thumb">🧦</div><div class="identity"><div class="id">${p.id}</div><div class="name">${p.name}</div><div class="sub">${p.category}</div></div></div>${m.join('')}<div><span class="status ${p.status==='待确认'?'warn':''}">${p.status}</span></div>${actions(p)}</div>`}
function card(p){let metrics=center==='cost'?[['单件销售成本',p.cost],['参数版本',p.ver],['来源',p.source]]:center==='price'?[['建议售价',p.price],['成本引用',p.cost],['毛利率',p.margin]]:[['SKU',p.sku],['负责人',p.owner],['分类',p.category]];return `<article class="card"><div class="cardtop"><div class="thumb">🧦</div><div class="identity"><div class="id">${p.id}</div><div class="name">${p.name}</div><div class="sub">${p.category}</div></div></div><div class="metrics">${metrics.map(x=>`<div><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}</div><div class="cardactions"><span class="status ${p.status==='待确认'?'warn':''}">${p.status}</span>${actions(p)}</div></article>`}
function renderTabs(){document.getElementById('tabs').innerHTML=cfg[center].tabs.map(x=>`<button data-tab="${x[0]}" class="${tab===x[0]?'active':''}">${x[1]}</button>`).join('')}
function render(){document.getElementById('centerTitle').textContent=cfg[center].title;document.getElementById('centerDesc').textContent=cfg[center].desc;document.getElementById('primaryAction').textContent=cfg[center].primary;renderTabs();let html='';if(tab==='list'){html=view==='list'?`<section class="object-table"><div class="row head"><div>商品对象</div><div>${center==='product'?'SKU':center==='cost'?'单件销售成本':'建议售价'}</div><div>${center==='product'?'负责人':center==='cost'?'参数版本':'最低毛利率'}</div><div class="hide-md">${center==='product'?'分类':center==='cost'?'数据来源':'成本引用'}</div><div>状态</div><div>对象操作</div></div>${products.map(row).join('')}</section>`:`<section class="cardgrid">${products.map(card).join('')}</section>`}else if(tab==='record'){html=`<section class="object-table"><div class="row head"><div>对象</div><div>版本</div><div>日期</div><div class="hide-md">变更原因</div><div>执行者</div><div></div></div>${products.map((p,i)=>`<div class="row"><div class="product"><div class="thumb">🧦</div><div class="identity"><div class="id">${p.id}</div><div class="name">${p.name}</div></div></div><div>V${12-i}</div><div>2026-09-0${3-i}</div><div class="hide-md">${center==='cost'?'物流参数更新':center==='price'?'成本变化触发重算':'对象资料更新'}</div><div>${i===0?'系统自动':'人工确认'}</div><div>${actions(p)}</div></div>`).join('')}</section>`}else{html=`<section class="object-table"><div style="padding:20px"><h3 style="margin-top:0">${cfg[center].title}设置</h3><p style="color:var(--muted)">参数按业务中心就近管理。本预览仅展示入口，不建立统一设置中心。</p><div class="kv">${(center==='cost'?[['汇率','CNY → JPY'],['国际运费规则','按重量 / 渠道'],['包装成本','按包装类型'],['平台基础交易费','按店铺 / 平台'],['预计退货率','规则参数'],['成本安全缓冲','规则参数']]:center==='price'?[['目标利润','¥500'],['目标毛利率','30%'],['最低毛利率','50%'],['尾数规则','80 / 90'],['活动价规则','按渠道'],['最低保本规则','启用']]:[['Product ID规则','MH + 7位序号'],['SKU ID规则','Product ID + 子序号'],['商品状态','准备中 / 可发布 / 在售 / 暂停 / 停售 / 归档'],['显示简称','AI可生成，人工可编辑']]).map(x=>`<div><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}</div></div></section>`}document.getElementById('content').innerHTML=html;bind()}
function openDrawer(id){const p=products.find(x=>x.id===id)||products[0];document.getElementById('drawerContent').innerHTML=`<div class="context"><div class="thumb">🧦</div><div class="identity"><div class="id">${p.id}</div><div class="name">${p.name}</div><div class="sub">${p.category}</div></div></div><div class="drawerbody"><div class="objecttools"><button>✎ 编辑</button><button>负责人</button><button>状态</button><button>☆ 关注</button><button>♡ 收藏</button><button>☵ 评论</button><button>@ 成员</button><button>附件</button><button>时间线</button><button>操作记录</button><button>关联对象</button><button>✦ AI摘要</button><button>更多</button></div><div class="section"><h4>${center==='cost'?'成本中心专业操作':center==='price'?'价格中心专业操作':'商品对象专业操作'}</h4><div class="objecttools">${center==='cost'?'<button>重新试算</button><button>人工修正</button><button>查看计算依据</button><button>查看历史成本</button><button>锁定成本版本</button>':center==='price'?'<button>重新定价</button><button>调整定价策略</button><button>查看保本价</button><button>渠道价格</button><button>查看价格历史</button>':'<button>打开执行工作区</button><button>管理 SKU</button><button>查看来源机会</button><button>商品关系</button>'}</div></div><div class="section"><h4>对象原则</h4><p style="color:var(--muted);line-height:1.7">当前页只改变专业上下文，不复制 Product / SKU。列表行、卡片、详情工作区均指向同一业务对象；公共对象能力由平台统一复用。</p></div></div>`;document.getElementById('drawer').classList.add('open');document.getElementById('backdrop').classList.add('open')}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('backdrop').classList.remove('open')}
function bind(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDrawer(b.dataset.open));document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()})}
document.querySelectorAll('[data-center]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-center]').forEach(x=>x.classList.remove('active'));b.classList.add('active');center=b.dataset.center;tab='list';render()});document.getElementById('viewToggle').onclick=()=>{view=view==='list'?'card':'list';document.getElementById('viewToggle').textContent=view==='list'?'▦ 卡片':'☷ 列表';render()};document.getElementById('close').onclick=closeDrawer;document.getElementById('backdrop').onclick=closeDrawer;render();
</script>
</body></html>
